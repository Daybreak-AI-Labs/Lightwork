{{- /* The single RWO state PVC is only used on the single-replica path; the
       autoscaling path is Postgres-backed and never mounts it, so don't create
       an orphan claim there (matches deployment.yaml's volume gating). */ -}}
{{- if and .Values.persistence.enabled (not .Values.autoscaling.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "maverick.fullname" . }}-state
  labels:
    {{- include "maverick.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
