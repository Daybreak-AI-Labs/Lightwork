[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightwork-dashboard"
version = "0.1.6"
description = "Local web dashboard + REST API for Maverick (FastAPI + htmx)"
requires-python = ">=3.10"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "cdayAI" }]
readme = "README.md"
dependencies = [
    "lightwork-agent>=0.1.6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.27",
    # starlette is FastAPI's HTTP/multipart core (imported directly by
    # app.py). 1.0.1 fixes PYSEC-2026-161.
    "starlette>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/Day-AI-Labs/maverick"

[project.scripts]
lightwork-dashboard = "lightwork_dashboard.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lightwork_dashboard*"]

[tool.setuptools.package-data]
lightwork_dashboard = ["templates/*.html", "static/*"]
