[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maverick-dashboard"
version = "0.1.6"
description = "Local web dashboard + REST API for Lightwork (FastAPI + htmx)"
requires-python = ">=3.10"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "cdayAI" }]
readme = "README.md"
dependencies = [
    "maverick-agent>=0.1.6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.27",
    # starlette is FastAPI's HTTP/multipart core (imported directly by
    # app.py). 1.0.1 fixes PYSEC-2026-161.
    "starlette>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/Day-AI-Labs/maverick"

[project.scripts]
maverick-dashboard = "maverick_dashboard.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maverick_dashboard*"]

[tool.setuptools.package-data]
# templates/*.js are Jinja-included by the .html templates (the flow designer's
# FDCore + designer scripts, the shared _dash_helpers). They MUST ship in the
# wheel/PyInstaller bundle or `{% include "flow_designer_core.js" %}` raises
# TemplateNotFound at render time (the page 500s in a built app while working
# from a source checkout). Keep this glob covering every template file type.
maverick_dashboard = ["templates/*.html", "templates/*.js", "static/*"]
