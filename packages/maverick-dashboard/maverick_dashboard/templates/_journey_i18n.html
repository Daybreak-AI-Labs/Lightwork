{% if journey_i18n %}<script type="application/json" id="lightwork-i18n-data">{{ (journey_i18n_bootstrap if journey_i18n_bootstrap is defined else journey_i18n)|tojson }}</script>{% endif %}
{# Fetch early without making the page body wait for either script. Execution
   remains ordered in the footer, before localized page controllers. #}
{% from "_assets.html" import asset -%}
{% if journey_i18n_asset %}<link rel="preload" as="script" href="{{ journey_i18n_asset }}">{% endif %}
<link rel="preload" as="script" href="{{ asset('lightwork-i18n.js') }}">
<link rel="stylesheet" href="{{ asset('lightwork-i18n.css') }}">
