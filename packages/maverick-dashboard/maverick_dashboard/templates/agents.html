{% extends "base.html" %}
{% block title %}Agent Factory · Lightwork{% endblock %}

{# One workflow-step row (Advanced editor). ``s`` is a step dict or ``none``
   (the empty row cloned for "Add step"). Macro keeps live rows + <template>
   in sync. #}
{% macro wf_row(s) %}
  <div class="wf-step" style="border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem; margin: 0.5rem 0;">
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: flex-end;">
      <label style="flex: 1; min-width: min(100%, 12rem);">Step name<br>
        <input type="text" class="input wf-name" style="width: 100%;" value="{{ s.name if s else '' }}">
      </label>
      <label style="min-width: min(100%, 9rem);">Does a person check it?<br>
        <select class="input wf-gate" style="width: 100%;">
          <option value="">No check</option>
          {% for g, label in [('approval', 'Someone must approve'), ('review', 'Someone reviews')] %}
          <option value="{{ g }}"{% if s and s.gate == g %} selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </label>
      <div style="display: flex; gap: 0.25rem;">
        <button type="button" class="btn btn--ghost wf-up">Move up</button>
        <button type="button" class="btn btn--ghost wf-down">Move down</button>
        <button type="button" class="btn btn--ghost btn--danger wf-del">Remove</button>
      </div>
    </div>
    <label style="display: block; margin-top: 0.4rem;">What to do in this step
      <textarea class="input wf-instruction" rows="2" style="width: 100%;">{{ s.instruction if s else '' }}</textarea>
    </label>
    <input type="hidden" class="wf-tools" value="{{ (s.tools | join(' ')) if s else '' }}">
    <div class="wf-tool-chips af-toolpick" data-target=".wf-tools" style="margin-top: 0.4rem;" aria-label="Actions used in this step"></div>
  </div>
{% endmacro %}

{% block content %}
<style>
  /* Agent Factory — the two-column "build a specialist + department roster"
     composition. Glass throughout; every agent-form id the save/validate
     script reads is preserved (the tool chips + approval toggle sync into the
     hidden inputs). */
  :where(body){
    --glass: color-mix(in srgb, var(--panel) 68%, transparent);
    --glass-soft: color-mix(in srgb, var(--panel) 54%, transparent);
    --glass-border: color-mix(in srgb, var(--text) 13%, transparent);
    --glass-edge: inset 0 1px 0 0 color-mix(in srgb, #ffffff 8%, transparent);
  }
  .af-lede{ margin: 0 0 var(--space-5); }
  .af-lede p{ margin: var(--space-1) 0 0; color: var(--muted); max-width: 46rem; }
  .af-grid{ display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: var(--space-5); align-items: start; }
  .af-grid > *, .af-card, .af-picker, .fld { min-width: 0; }
  @media (max-width: 900px){ .af-grid{ grid-template-columns: minmax(0, 1fr); } }
  .af-card{ border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
    background: var(--glass-soft); box-shadow: var(--shadow-sm), var(--glass-edge);
    -webkit-backdrop-filter: blur(14px) saturate(150%); backdrop-filter: blur(14px) saturate(150%);
    padding: var(--space-5); }
  .af-card__title{ font-weight: var(--font-semibold); font-size: var(--text-lg); margin: 0 0 var(--space-4); }
  .fld{ margin: 0 0 var(--space-4); }
  .fld > label{ display: block; font-weight: var(--font-semibold); margin-bottom: var(--space-2); }
  .fld .sub{ font-weight: 400; color: var(--muted); }
  .af-card input[type="text"], .af-card textarea, .af-card select{
    width: 100%; min-width: 0; max-width: 100%; background: var(--surface-sunken); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-md); padding: 0.55rem 0.7rem; font: inherit;
    transition: border-color .13s ease, box-shadow .13s ease; }
  .af-card input:focus, .af-card textarea:focus, .af-card select:focus{
    outline: none; border-color: var(--brand-border); box-shadow: 0 0 0 3px var(--brand-subtle); }
  #f-persona{ min-height: 7rem; line-height: 1.5; resize: vertical; }

  /* tool chips */
  .chips{ display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .chip{ display: inline-flex; align-items: center; gap: 6px; padding: 0.4rem 0.75rem;
    border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--surface-sunken);
    color: var(--text); font-size: var(--text-sm); cursor: pointer;
    transition: border-color .12s ease, background .12s ease; }
  .chip:hover{ border-color: var(--border-strong); }
  .chip.on{ border-color: var(--brand-border); background: var(--brand-subtle); }
  .chip .tick{ color: var(--brand-hi); font-weight: 700; }
  .chip.add{ border-style: dashed; color: var(--muted); }

  /* guardrails */
  .guard-row{ display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: 0.55rem 0; }
  .guard-row + .guard-row{ border-top: 1px solid var(--hairline); }
  .guard-row .tt{ flex: 1; min-width: min(100%, 8rem); } .guard-row .tt small{ display: block; color: var(--muted); }
  .switch{ width: 42px; height: 24px; border-radius: var(--radius-pill); background: var(--border);
    position: relative; cursor: pointer; flex: none; border: 0; transition: background .16s; }
  .switch::after{ content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff; transition: transform .16s; }
  .switch[aria-pressed="true"]{ background: var(--brand); }
  .switch[aria-pressed="true"]::after{ transform: translateX(18px); }
  [dir="rtl"] .switch[aria-pressed="true"]::after{ transform: translateX(-18px); }
  .risk-seg{ display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
  .risk-seg button{ font: inherit; font-size: var(--text-sm); padding: 0.35rem 0.8rem; background: transparent;
    color: var(--muted); border: 0; cursor: pointer; }
  .risk-seg button.on{ background: var(--brand); color: var(--brand-fg); font-weight: var(--font-semibold); }
  .model-badge{ display: inline-flex; align-items: center; gap: 6px; padding: 0.22rem 0.6rem;
    border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: var(--font-semibold);
    color: var(--accent); background: var(--success-subtle);
    border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent); text-decoration: none; }

  .advanced{ border: 1px solid var(--glass-border); border-radius: var(--radius-md);
    background: var(--glass); margin: 0 0 var(--space-4); overflow: hidden; }
  .advanced > summary{ cursor: pointer; list-style: none; padding: 0.6rem var(--space-4);
    display: flex; align-items: center; gap: var(--space-2); color: var(--muted); font-size: var(--text-sm); }
  .advanced > summary::-webkit-details-marker{ display: none; }
  .advanced > summary::before{ content: "⚙"; }
  .advanced__caret{ margin-inline-start: auto; transition: transform .18s ease; }
  .advanced[open] .advanced__caret{ transform: rotate(180deg); }
  .advanced__body{ padding: 0 var(--space-4) var(--space-4); }
  .af-actions{ display: flex; gap: var(--space-2); flex-wrap: wrap;
    padding-top: var(--space-3); border-top: 1px solid var(--hairline); }

  /* departments roster */
  .roster__head{ display: flex; align-items: center; justify-content: space-between; margin: 0 0 var(--space-3); }
  .roster__head h2{ margin: 0; font-size: var(--text-lg); font-weight: var(--font-semibold);
    text-transform: none; letter-spacing: 0; color: var(--text); }
  .dept{ border: 1px solid var(--glass-border); border-radius: var(--radius-lg); background: var(--glass-soft);
    box-shadow: var(--shadow-sm), var(--glass-edge); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    padding: var(--space-4); margin-bottom: var(--space-3); }
  .dept__head{ display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
  .dept__avatar{ width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center;
    background: var(--brand-subtle); color: var(--brand-hi); font-weight: var(--font-semibold); }
  .dept__name{ font-weight: var(--font-semibold); }
  .dept__sub{ color: var(--muted); font-size: var(--text-sm); }
  .dept__preview{ color: var(--muted); font-size: var(--text-sm); margin: var(--space-3) 0;
    text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dept__foot{ display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .dept__addon{ color: var(--muted); font-size: var(--text-xs); align-self: center; }

  /* Ekko is the discovery front door into the factory.  The card mirrors the
     dark, violet-edged Work Discovery treatment while remaining a semantic
     link (keyboard/focus behavior comes for free). */
  .af-ekko{ position: relative; overflow: hidden; display: grid;
    grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--space-4);
    margin: 0 0 var(--space-4); padding: var(--space-4) var(--space-5);
    border: 1px solid var(--brand-border); border-radius: var(--radius-lg);
    background: linear-gradient(120deg, color-mix(in srgb, var(--panel) 88%, transparent),
      color-mix(in srgb, var(--brand) 13%, var(--surface-1)));
    color: var(--text); text-decoration: none; box-shadow: var(--shadow-sm), var(--glass-edge); }
  .af-ekko::before{ content: ""; position: absolute; inset: 0 0 auto; height: 3px;
    background: linear-gradient(90deg, var(--brand-hi), var(--accent), transparent 78%); }
  .af-ekko:hover{ border-color: var(--brand-hi); }
  .af-ekko:focus-visible{ outline: 3px solid var(--ring); outline-offset: 3px; }
  .af-ekko__eyebrow{ color: var(--brand-hi); font-size: var(--text-xs); font-weight: 750;
    letter-spacing: .12em; text-transform: uppercase; }
  .af-ekko__title{ display: flex; align-items: baseline; gap: var(--space-2); margin-top: .12rem; }
  .af-ekko__title strong{ font-size: var(--text-xl); letter-spacing: .04em; }
  .af-ekko__title em{ color: var(--accent); }
  .af-ekko p{ margin: var(--space-1) 0 0; color: var(--muted); max-width: 48rem; }
  @media (max-width: 640px){ .af-ekko{ grid-template-columns: 1fr; } }
</style>

  {% from "_hero.html" import hero, state %}
  {# The main action: a new custom agent. While a specialist is open, saving
     it is the main action, so the header link steps back to a plain button. #}
  {% set agents_actions %}<a class="btn{% if not selected %} btn--primary{% endif %}" href="/agents?new=1#agent-form">New custom agent</a>{% endset %}
  {% call hero('Build your workforce', 'Agent Factory',
               subtitle='Hire & tailor specialists',
               lede='Describe a specialist in plain English — its job, the
                     tools it can reach, and its guardrails — and Lightwork
                     tailors it for you. Saving updates only what you change;
                     anything that would weaken the safety limits is
                     rejected, not saved.',
               actions=agents_actions if (editable and not creating) else '') %}
    {{ state('Current state', 'Safety limits enforced',
             badge='guarded', badge_class='ok',
             copy='Edits that widen tool access or raise the maximum risk level
                   are rejected at save time — these limits only ever
                   tighten.') }}
  {% endcall %}
  {% if can_open_page('/roles') %}<p><a href="/roles">See the kinds of agent</a> that share every task and the model each one uses.</p>{% endif %}

  <a class="af-ekko" href="/ekko" id="ekko-work-discovery-card">
    <span>
      <span class="af-ekko__eyebrow">Digital workforce intelligence</span>
      <span class="af-ekko__title"><strong>EKKO</strong><em>Work Discovery</em></span>
      <p>Listens to approved work activity and maps recurring processes into evidence-backed first passes
        for Lightwork flows and specialists.</p>
    </span>
    <span class="btn" aria-hidden="true">Open Work Discovery →</span>
  </a>

  {% if not editable %}
  <p><span class="badge">read-only</span> <span class="muted">Agent editing is turned off by your administrator — viewing only.</span></p>
  {% endif %}

  {% if rejected_agents %}
  <section class="af-card" id="agent-setup-review" aria-labelledby="agent-setup-review-title" style="margin-bottom: var(--space-4);">
    <h2 id="agent-setup-review-title" class="af-card__title">Specialists paused for setup review</h2>
    <p class="muted">These specialists cannot run. Restore a standard specialist to its original setup, or remove an unavailable custom specialist.</p>
    {% for item in rejected_agents %}
    <div style="display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; padding:var(--space-2) 0; border-top:1px solid var(--hairline);">
      <strong>{{ item.name | humanize }}</strong>
      {% if item.generation %}
      <button type="button" class="btn btn--ghost af-recover" data-name="{{ item.name }}" data-generation="{{ item.generation }}" data-builtin="{{ '1' if item.is_builtin else '0' }}">
        {{ 'Restore original setup' if item.is_builtin else 'Remove unavailable specialist' }}
      </button>
      {% else %}
      <span class="muted">Installation support must repair this setup.</span>
      {% endif %}
      <span class="muted af-recover-status" role="status" aria-live="polite"></span>
    </div>
    {% endfor %}
  </section>
  <script>
    document.querySelectorAll('.af-recover').forEach(function (button) {
      button.addEventListener('click', async function () {
        const name = button.dataset.name;
        const builtIn = button.dataset.builtin === '1';
        const status = button.parentElement.querySelector('.af-recover-status');
        const question = builtIn
          ? 'Restore “' + name + '” to its original setup? Its custom limits will be removed. The built-in policy may allow more; review it after restoring.'
          : 'Remove “' + name + '”? Its saved custom setup will be removed.';
        if (!(await mvConfirm(question, { okText: builtIn ? 'Restore specialist' : 'Remove specialist' }))) return;
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
        try {
          const path = '/api/v1/agents/' + encodeURIComponent(name)
            + '/override?expected_generation=' + encodeURIComponent(button.dataset.generation);
          const response = await fetch(path, { method: 'DELETE' });
          if (!response.ok) throw new Error('This specialist changed or could not be restored. Refresh and try again.');
          const result = await response.json();
          if (!result.removed) throw new Error('No saved setup was removed. Refresh to check its status.');
          window.location.href = builtIn ? '/agents?name=' + encodeURIComponent(name) : '/agents';
        } catch (error) {
          status.textContent = error.message || 'Could not restore this specialist.';
          button.disabled = false;
          button.removeAttribute('aria-busy');
        }
      });
    });
  </script>
  {% endif %}

  <details class="af-card" id="jd-card" style="margin-bottom: var(--space-4);">
    <summary style="cursor: pointer; font-weight: 600;">Hire from a job description
      <span class="muted" style="font-weight: 400;">— paste a JD to meet the specialists you already employ, or draft a new one</span>
    </summary>
    <div style="margin-top: 0.8rem;">
      <div class="fld">
        <label for="jd-text">Job description <span class="sub">— paste the text, or upload a file below</span></label>
        <textarea id="jd-text" rows="7" placeholder="Paste the role's summary and responsibilities — bullet points become the draft's playbook steps."></textarea>
      </div>
      <div class="fld" style="display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center;">
        <label for="jd-file" class="sub">or upload</label>
        <input id="jd-file" type="file" accept=".txt,.md,.pdf,.docx,.doc,.odt">
        <span style="flex: 1;"></span>
        <button type="button" class="btn" id="jd-match">Find matching specialists</button>
        {% if editable %}
        <button type="button" class="btn" id="jd-draft">Draft a new specialist</button>
        {% endif %}
      </div>
      <div id="jd-msg" role="status" aria-live="polite" class="muted" style="min-height: 1.2rem;"></div>
      <div id="jd-results"></div>
    </div>
  </details>

  {% if editable %}
  <details class="af-card" id="biz-setup" style="margin-bottom: var(--space-4);">
    <summary style="cursor: pointer; font-weight: 600;">Set up a specialist for your business
      <span class="muted" style="font-weight: 400;">— describe what you do, review the draft, then add it with your documents</span>
    </summary>
    <form id="biz-form" style="margin-top: 0.8rem;" novalidate>
      <div class="fld"><label for="biz-name">Name for your new specialist</label>
        <input id="biz-name" class="input" type="text" maxlength="120" placeholder="For example, Acme customer support" required>
        <p class="sub">Give it a name that sets it apart from the specialists already in your workspace.</p></div>
      <div class="fld"><label for="biz-what">What does the business do?</label>
        <textarea id="biz-what" class="textarea" rows="4" maxlength="4000"></textarea></div>
      <div class="fld"><label for="biz-industry">Industry (optional)</label>
        <input id="biz-industry" class="input" type="text" maxlength="120"></div>
      <div class="fld"><label for="biz-ai">How to draft it</label>
        <select id="biz-ai" class="select">
          <option value="ai">Draft it with AI (counts toward your spending limits, at most $0.50)</option>
          <option value="plain">Draft it from a standard outline (no AI)</option>
        </select></div>
      <button type="submit" class="btn" id="biz-draft">Draft the specialist</button>
    </form>
    <p id="biz-status" role="status" aria-live="polite" tabindex="-1" class="muted"></p>
    <div id="biz-review" hidden>
      <div id="biz-summary"></div>
      <div class="fld"><label for="biz-docs">Documents it should know (optional, up to 10)</label>
        <input id="biz-docs" type="file" multiple accept=".txt,.md,.pdf,.docx,.doc,.odt,.csv,.png,.jpg,.jpeg"></div>
      <button type="button" class="btn" id="biz-approve">Add this specialist</button>
      <button type="button" class="btn btn--ghost" id="biz-discard">Discard the draft</button>
    </div>
  </details>
  {% endif %}

  <div class="af-grid">
    <!-- ============ LEFT: build a specialist ============ -->
    <div class="af-card">
      <div class="af-card__title">Build a specialist</div>
      <p class="muted" style="font-size: var(--text-sm); margin: calc(-1 * var(--space-3)) 0 var(--space-4);">
        Three steps: describe the job, choose the tools it may use, set its
        guardrails. Nothing changes until you save.
      </p>

      <div class="fld af-picker">
        {% if agents %}
        <label for="agent-picker">Start from a specialist <span class="sub">— search {{ agents|length }} prebuilt specialists</span></label>
        <div style="display:flex; gap:var(--space-2); align-items:center;">
          {# A searchable picker, not a 2,000-option dropdown: type to filter,
             pick to open. Navigation happens only on an exact match. #}
          <input id="agent-picker" list="agent-picker-list" type="text" autocomplete="off"
                 spellcheck="false" style="flex:1;" class="input"
                 aria-label="Choose a specialist to tailor"
                 placeholder="Type to search, for example “forecasting” or “onboarding”"
                 value="{{ ((selected.description or (selected.name | humanize)) if selected else '') }}">
          <datalist id="agent-picker-list">
            {% for a in agents %}
            <option value="{{ (a.description or (a.name | humanize)) }}{% if a.is_override %} (custom){% endif %}" data-name="{{ a.name }}" data-ready="{{ '1' if a.readiness.state == 'action_ready' else '0' }}" label="{{ a.readiness.label }}"{% if a.readiness.state != 'action_ready' %} disabled{% endif %}></option>
            {% endfor %}
          </datalist>
          <button type="button" class="btn" id="agent-picker-open">Open</button>
          {% if editable %}
          <span class="sub">or</span>
          <a class="btn" href="/agents?new=1#agent-form" id="btn-new-agent">＋ New custom agent</a>
          {% endif %}
        </div>
        <label class="sub" style="display:inline-flex;align-items:center;gap:var(--space-2);margin-top:var(--space-2);">
          <input id="agent-show-needs-setup" type="checkbox"> Show specialists that need setup
        </label>
        <p class="sub" style="margin:var(--space-1) 0 0;">The list starts with specialists whose required actions are available. Live connections, permissions and the AI service are checked when work starts.</p>
        {% elif editable %}
        <a class="btn" href="/agents?new=1#agent-form" id="btn-new-agent">＋ New custom agent</a>
        {% endif %}
      </div>

      {% if selected %}
      <div class="panel" style="margin-bottom:var(--space-3);">
        <strong>{{ selected.readiness.label }}</strong>
        {% if selected.readiness.state == 'needs_setup' %}
        <p class="muted">Required actions are unavailable here: {{ selected.readiness.missing_labels | join(', ') }}.</p>
        <a href="{{ selected.readiness.fix_url }}">Review setup</a>
        {% elif selected.readiness.state == 'unknown' %}
        <p class="muted">Lightwork could not check this specialist's required actions. Ask an administrator to review setup before assigning work.</p>
        {% else %}
        <p class="muted">The required actions are present. Live connections, permissions and the AI service are checked when work starts.</p>
        {% endif %}
      </div>
      <div style="display:flex; gap:var(--space-2); align-items:center; margin-bottom:var(--space-3);">
        <button type="button" class="btn" id="btn-jobcard">📋 View job card</button>
        <span class="sub">the specialist's job description, manager scorecard &amp; cost tier</span>
      </div>
      {% endif %}
      {% if selected or creating %}
      <div id="agent-msg" role="status" aria-live="polite" class="muted" style="min-height: 1.2rem;"></div>
      <form id="agent-form" data-name="{{ selected.name if selected else '' }}" data-generation="{{ selected.generation if selected else 'new' }}" data-creating="{{ '1' if creating else '' }}">
        {% if creating %}
        <div class="fld">
          <label for="f-new-id">Short name <span class="sub">— filled in from the name below; change it if you like</span></label>
          <input id="f-new-id" type="text" class="input" placeholder="onboarding assistant" autocomplete="off" spellcheck="false">
        </div>
        {% endif %}
        <div class="fld">
          <label for="f-description">Name <span class="sub">— a short summary of the role</span></label>
          <input id="f-description" name="description" type="text" value="{{ selected.description if selected else '' }}">
        </div>
        <div class="fld">
          <label for="f-persona">What should it do? <span class="sub">— plain English</span></label>
          <textarea id="f-persona" name="persona" rows="6" placeholder="Describe the job in plain English — what it handles, how it should behave, what 'done' looks like.">{{ selected.persona if selected else '' }}</textarea>
          <p class="sub" style="margin: var(--space-1) 0 0; font-size: var(--text-sm);">The clearer the brief, the better the specialist — say what it handles, and what a finished result looks like.</p>
        </div>

        <div class="fld">
          <label>Allowed actions <span class="sub">— what it can use</span></label>
          <div class="chips" id="skill-chips" aria-label="Tools this specialist can use"></div>
          {# The chips sync into this hidden input, which the save script reads. #}
          <input id="f-allow" name="allow_tools" type="hidden" value="{{ selected.allow_tools|join(' ') if selected else '' }}">
          <p class="sub" style="margin: var(--space-2) 0 0; font-size: var(--text-sm);">Select an action to allow it; select it again to remove access. Anything not allowed here stays out of reach.</p>
        </div>

        <div class="fld">
          <label>Guardrails <span class="sub">— the safety limits it works within</span></label>
          <div class="guard-row">
            <span class="tt">Highest risk it may take
              <small>The maximum risk allowed for its actions.</small></span>
            {% set cur_risk = selected.max_risk if selected else 'low' %}
            <span class="risk-seg" id="risk-seg" role="group" aria-label="Maximum risk level">
              {% for r in ['low', 'medium', 'high'] %}
              <button type="button" data-risk="{{ r }}"{% if cur_risk == r %} class="on" aria-pressed="true"{% else %} aria-pressed="false"{% endif %}>{{ r | capitalize }}</button>
              {% endfor %}
            </span>
            <select id="f-risk" name="max_risk" hidden aria-label="Maximum risk level">
              {% for r in ['low', 'medium', 'high'] %}
              <option value="{{ r }}"{% if cur_risk == r %} selected{% endif %}>{{ r | capitalize }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="guard-row">
            <span class="tt">Include a final human review
              <small>Adds review instructions to the last step. For an enforced pause, use an approval step in a flow.</small></span>
            <button type="button" class="switch" id="g-approval" aria-pressed="false"
                    aria-label="Include final human review instructions"></button>
          </div>
          <div class="guard-row">
            <span class="tt">Model <small>Runs on your configured model; set per role in Settings.</small></span>
            <a class="model-badge" href="/settings">● Model · Settings</a>
          </div>
        </div>

        {% set auto = selected.autonomy if selected else none %}
        <section class="panel" id="agent-autonomy"
                 data-default="{{ auto.default if auto else 'suggest' }}"
                 data-low="{{ auto.low if auto and auto.low else '' }}"
                 data-medium="{{ auto.medium if auto and auto.medium else '' }}"
                 data-high="{{ auto.high if auto and auto.high else '' }}"
                 data-onboarding="{{ 'true' if not auto or auto.onboarding else 'false' }}"
                 data-overridden="{{ '1' if selected and 'autonomy' in selected.overridden else '0' }}"
                 data-config-override="{{ '1' if auto and auto.config_override else '0' }}"
                 data-pack="{{ auto.pack | tojson | forceescape if auto else '' }}">
          <h3>Independence</h3>
          <p class="sub">Set how this specialist handles consequential actions. Allowed actions, risk limits, approvals and hard refusals still apply.</p>
          {% if auto and not auto.levels_enabled %}
          <p class="muted" role="status">Independence levels are off for this workspace. These choices take effect only after an installation administrator turns on <a href="/settings/all?id=workforce.levels">Per-agent independence levels</a>.</p>
          {% endif %}
          {% if auto and auto.config_override %}
          <p class="muted" role="status">This specialist has a server-configured independence policy. An installation administrator must remove that override before editing it here.</p>
          {% endif %}
          {% for risk, title in [('default', 'Usual actions'), ('low', 'Low-risk actions'), ('medium', 'Medium-risk actions'), ('high', 'High-risk actions')] %}
          {% set chosen = auto[risk] if auto else ('suggest' if risk == 'default' else none) %}
          <div class="fld">
            <label for="f-auto-{{ risk }}">{{ title }}</label>
            <select id="f-auto-{{ risk }}" class="input"{% if not editable or (auto and auto.config_override) %} disabled{% endif %}>
              {% if risk != 'default' %}<option value=""{% if not chosen %} selected{% endif %}>Use usual level</option>{% endif %}
              {% for level, label in [('observe', 'Watch only'), ('suggest', 'Suggest; a person acts'), ('request', 'Ask before acting'), ('auto', 'Act on its own')] %}
              <option value="{{ level }}"{% if chosen == level %} selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          {% endfor %}
          <label class="sub" for="f-auto-onboarding">
            <input id="f-auto-onboarding" type="checkbox"{% if not auto or auto.onboarding %} checked{% endif %}{% if not editable or (auto and auto.config_override) %} disabled{% endif %}>
            Supervise this specialist while it is new
          </label>
          <p class="sub">Supervision lowers each chosen level by one step. An overall approval record can support ending supervision only when every level is Ask or lower. Act on its own needs proof for the specific actions it would take.</p>
        </section>

        <details class="advanced">
          <summary>More — blocked actions and the step-by-step playbook
            <svg class="advanced__caret" width="12" height="12" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </summary>
          <div class="advanced__body">
            <div class="fld">
              <label>Actions it may never use</label>
              <input id="f-deny" name="deny_tools" type="hidden" value="{{ selected.deny_tools|join(' ') if selected else '' }}">
              <div class="af-toolpick" id="deny-chips" data-target="#f-deny" aria-label="Actions it may never use"></div>
            </div>
            <fieldset style="border: 1px solid var(--border); border-radius: 6px; margin: 0.5rem 0; padding: 0.6rem 0.8rem;">
              <legend>Workflow playbook <span class="muted">— ordered steps the agent follows</span></legend>
              <div id="wf-steps">
                {% if selected %}{% for s in selected.workflow %}{{ wf_row(s) }}{% endfor %}{% endif %}
              </div>
              {% if editable %}<button type="button" class="btn btn--ghost" id="wf-add">Add a step</button>{% endif %}
            </fieldset>
            {% if editable and selected and selected.workflow %}
            <p><a class="btn btn--ghost" href="/workflow-builder?edit_agent={{ selected.name | urlencode }}">Edit playbook in builder</a></p>
            {% endif %}
          </div>
        </details>

        {% if editable %}
        <div class="af-actions">
          <button type="button" class="btn btn--primary" id="btn-save">{{ 'Create custom agent' if creating else 'Save specialist' }}</button>
          <button type="button" class="btn" id="btn-validate">Check settings</button>
          {% if not creating %}<button type="button" class="btn btn--ghost" id="btn-reset">Reset to built-in</button>{% endif %}
        </div>
        {% else %}
        <p class="muted">Editing is disabled in this deployment.</p>
        {% endif %}
      </form>

      {% if selected and (selected.errors or selected.warnings) %}
      <div class="panel" style="margin-top: 1rem;">
        {% for e in selected.errors %}<div>⛔ {{ e }}</div>{% endfor %}
        {% for w in selected.warnings %}<div class="muted">⚠ {{ w }}</div>{% endfor %}
      </div>
      {% endif %}
      {% else %}
      <p class="muted">Pick a specialist above to tailor it — or start a <a href="/agents?new=1#agent-form">new custom agent</a>.</p>
      {% endif %}
    </div>

    <!-- ============ RIGHT: your departments ============ -->
    <div>
      <div class="roster__head">
        <h2>Your departments</h2>
        <a class="btn btn--ghost" href="/workforce" style="font-size: var(--text-sm);">Manage →</a>
      </div>
      <div id="dept-roster">
        <p class="muted" id="dept-loading">Loading departments…</p>
      </div>
      <dialog id="dept-dialog" aria-labelledby="dept-dlg-title"
              style="border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 0; width: min(560px, calc(100vw - 2rem)); max-height: min(80vh, 720px); background: var(--bg); color: var(--text); box-shadow: var(--shadow-lg); margin: auto; overflow: hidden;">
        <div style="display: flex; flex-direction: column; max-height: min(80vh, 720px);">
        <div style="display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border);">
          <span class="dept__avatar" id="dept-dlg-avatar"></span>
          <div style="flex: 1; min-width: 0;">
            <h3 id="dept-dlg-title" style="margin: 0; font-size: var(--text-lg); text-transform: none; letter-spacing: 0; color: var(--text);"></h3>
            <div class="muted" id="dept-dlg-sub" style="font-size: var(--text-sm);"></div>
          </div>
          <button class="btn btn--ghost" id="dept-dlg-close" aria-label="Close department details">✕</button>
        </div>
        <div style="padding: var(--space-4) var(--space-5); overflow-y: auto; flex: 1; min-height: 0;">
          <p class="muted" id="dept-dlg-charter" style="margin-top: 0;"></p>
          <div class="muted" style="font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: var(--space-2);">Specialists on this team</div>
          <ul id="dept-dlg-members" style="margin: 0; padding-inline-start: 1.2rem; text-transform: capitalize;"></ul>
        </div>
        <div style="display: flex; gap: var(--space-2); justify-content: flex-end; align-items: center; padding: var(--space-3) var(--space-5); border-top: 1px solid var(--border);">
          <span class="muted" id="dept-dlg-msg" role="status" aria-live="polite" style="margin-inline-end: auto; font-size: var(--text-sm);"></span>
          <a class="btn btn--ghost" href="/workforce" style="font-size: var(--text-sm);">Open Workforce ↗</a>
          <button class="btn btn--primary" id="dept-dlg-deploy" type="button">Deploy team</button>
        </div>
        </div>
      </dialog>
    </div>
  </div>

  {% if (selected or creating) and editable %}
  <template id="wf-row-tpl">{{ wf_row(none) }}</template>
  {% endif %}

  <script>
    // ---- shared page helpers: plain errors, readable names, action pickers ----
    function plainError(failure, what) {
      return window.mvErrorText ? window.mvErrorText(failure, what) : 'Could not ' + what + '. Please try again.';
    }
    function humanName(v) {
      if (window.mvHuman) return window.mvHuman(v);
      v = String(v || '').replace(/[_.-]+/g, ' ').trim();
      return v.charAt(0).toUpperCase() + v.slice(1);
    }
    var afToolList = null;
    function toolChoices() {
      if (!afToolList) {
        afToolList = fetch('/api/v1/tools').then(function (r) { return r.ok ? r.json() : { tools: [] }; })
          .then(function (j) {
            return (j.tools || []).map(function (t) { return { value: t.name, label: humanName(t.name) }; })
              .sort(function (a, b) { return a.label.localeCompare(b.label); });
          }).catch(function () { return []; });
      }
      return afToolList;
    }
    // An action picker: the chosen actions as removable chips plus a dropdown
    // to add one, kept in step with a hidden space-separated input.
    function mountToolPick(box) {
      if (!box || box.dataset.mounted) return;
      box.dataset.mounted = '1';
      var target = box.dataset.target || '';
      var hidden = target.charAt(0) === '#' ? document.querySelector(target)
        : (box.closest('.wf-step') || document).querySelector(target);
      if (!hidden) return;
      var readOnly = !document.getElementById('btn-save');
      function current() { return (hidden.value || '').split(/\s+/).filter(Boolean); }
      function paint() {
        box.textContent = '';
        var chosen = current();
        var chips = document.createElement('div'); chips.className = 'chips';
        chosen.forEach(function (name) {
          var chip = document.createElement('button'); chip.type = 'button'; chip.className = 'chip on';
          chip.textContent = humanName(name) + (readOnly ? '' : ' — remove');
          chip.setAttribute('aria-label', 'Remove ' + humanName(name));
          if (readOnly) chip.disabled = true;
          chip.addEventListener('click', function () {
            hidden.value = current().filter(function (x) { return x !== name; }).join(' '); paint();
          });
          chips.appendChild(chip);
        });
        if (!chosen.length) { var none = document.createElement('span'); none.className = 'sub'; none.textContent = 'None chosen.'; chips.appendChild(none); }
        box.appendChild(chips);
        if (readOnly) return;
        var sel = document.createElement('select'); sel.className = 'input';
        sel.setAttribute('aria-label', box.getAttribute('aria-label') ? 'Add to: ' + box.getAttribute('aria-label') : 'Add an action');
        var first = document.createElement('option'); first.value = ''; first.textContent = 'Add an action…'; sel.appendChild(first);
        toolChoices().then(function (list) {
          list.forEach(function (t) {
            if (chosen.indexOf(t.value) !== -1) return;
            var o = document.createElement('option'); o.value = t.value; o.textContent = t.label; sel.appendChild(o);
          });
        });
        sel.addEventListener('change', function () {
          if (!sel.value) return;
          var next = current(); if (next.indexOf(sel.value) === -1) next.push(sel.value);
          hidden.value = next.join(' '); paint();
        });
        box.appendChild(sel);
      }
      paint();
    }
    function mountToolPicks() { document.querySelectorAll('.af-toolpick').forEach(mountToolPick); }

    // Open the chosen prebuilt specialist from the search box.
    (function () {
      var picker = document.getElementById('agent-picker');
      if (!picker) return;
      var showAll = document.getElementById('agent-show-needs-setup');
      if (showAll) showAll.addEventListener('change', function () {
        document.querySelectorAll('#agent-picker-list option').forEach(function (option) {
          option.disabled = !showAll.checked && option.dataset.ready !== '1';
        });
      });
      function go() {
        var v = picker.value.trim(); if (!v) return;
        var match = Array.prototype.find.call(document.querySelectorAll('#agent-picker-list option'), function (o) {
          return !o.disabled && (o.value.toLowerCase() === v.toLowerCase() || o.dataset.name === v);
        });
        if (match) location.href = '/agents?name=' + encodeURIComponent(match.dataset.name);
      }
      picker.addEventListener('change', go);
      var open = document.getElementById('agent-picker-open');
      if (open) open.addEventListener('click', function () {
        go();
        if (!Array.prototype.some.call(document.querySelectorAll('#agent-picker-list option'), function (o) { return !o.disabled && o.value.toLowerCase() === picker.value.trim().toLowerCase(); })) {
          mvToast('Choose a specialist from the list, or show those needing setup.', { error: true });
        }
      });
    })();

    // ---- JD hiring: match the roster / draft a new specialist from a JD ----
    // Runs BEFORE the chips/risk initializers below so a drafted pack stashed in
    // sessionStorage can prefill the form inputs those initializers read.
    (function () {
      var jdText = document.getElementById('jd-text');
      var jdFile = document.getElementById('jd-file');
      var jdMsg = document.getElementById('jd-msg');
      var results = document.getElementById('jd-results');
      var matchBtn = document.getElementById('jd-match');
      var draftBtn = document.getElementById('jd-draft');

      function esc(s) {
        return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
          return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
        });
      }
      function say(text, ok) {
        if (jdMsg) { jdMsg.textContent = text; jdMsg.style.color = ok ? 'var(--accent)' : 'var(--danger)'; }
      }

      // --- prefill the editor from a drafted pack (set BEFORE initializers run) ---
      (function prefill() {
        var raw = sessionStorage.getItem('jd-draft');
        if (!raw) return;
        var form = document.getElementById('agent-form');
        if (!form || form.dataset.creating !== '1') return;
        sessionStorage.removeItem('jd-draft');
        var d; try { d = JSON.parse(raw); } catch (e) { return; }
        function set(id, v) { var el = document.getElementById(id); if (el && v != null) el.value = v; }
        set('f-new-id', d.name);
        set('f-description', d.description);
        set('f-persona', d.persona);
        set('f-allow', (d.allow_tools || []).join(' '));
        set('f-deny', (d.deny_tools || []).join(' '));
        if (d.max_risk) {
          set('f-risk', d.max_risk);
          var seg = document.getElementById('risk-seg');
          if (seg) seg.querySelectorAll('button[data-risk]').forEach(function (b) {
            var on = b.dataset.risk === d.max_risk;
            b.classList.toggle('on', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
        }
        var stepsEl = document.getElementById('wf-steps');
        var tpl = document.getElementById('wf-row-tpl');
        if (stepsEl && tpl && Array.isArray(d.workflow)) {
          d.workflow.forEach(function (s) {
            var frag = tpl.content.cloneNode(true);
            frag.querySelector('.wf-name').value = s.name || '';
            frag.querySelector('.wf-instruction').value = s.instruction || '';
            frag.querySelector('.wf-tools').value = (s.tools || []).join(' ');
            frag.querySelector('.wf-gate').value = s.gate || '';
            stepsEl.appendChild(frag);
          });
        }
        var m = document.getElementById('agent-msg');
        if (m) m.textContent = 'Drafted from the job description — review its limits and steps, then save.';
      })();

      if (!matchBtn) return;

      function renderMatches(list) {
        if (!list.length) {
          results.innerHTML = '<p class="muted">No matches — draft a new specialist instead.</p>';
          return;
        }
        var rows = list.map(function (m, i) {
          var pct = Math.round((m.fit || 0) * 100);
          var terms = (m.matched_terms || []).slice(0, 6).join(', ');
          return '<div class="panel" style="margin: 0.5rem 0; padding: 0.6rem 0.8rem;">'
            + '<div style="display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap;">'
            + '<strong><a href="/agents?name=' + encodeURIComponent(m.name) + '">' + esc(m.name) + '</a></strong>'
            + (m.department ? '<span class="muted">' + esc(m.department) + '</span>' : '')
            + '<span class="muted" style="margin-left: auto;">' + pct + '% match</span>'
            + '<button type="button" class="btn jd-hire-btn" data-pack="' + esc(m.name) + '">Add to team…</button>'
            + '</div>'
            + '<div class="muted" style="font-size: var(--text-sm);">' + esc(m.description || '') + '</div>'
            + (terms ? '<div class="muted" style="font-size: var(--text-xs);">Matched on: ' + esc(terms) + '</div>' : '')
            + '</div>';
        }).join('');
        results.innerHTML = '<p class="muted" style="margin-top: 0.6rem;">Specialists already on your roster, best fit first:</p>' + rows;
      }

      matchBtn.addEventListener('click', function () {
        var text = (jdText.value || '').trim();
        var file = jdFile.files && jdFile.files[0];
        say('Matching against the roster…', true);
        var req;
        if (!text && file) {
          var fd = new FormData();
          fd.append('file', file);
          fd.append('k', '5');
          req = fetch('/api/v1/agents/jd/match-from-file', { method: 'POST', body: fd });
        } else if (text) {
          req = fetch('/api/v1/agents/jd/match', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ jd_text: text, k: 5 }),
          });
        } else {
          say('Paste a job description or choose a file first.', false);
          return;
        }
        req.then(function (r) { return r.json().catch(function () { throw new Error('The result could not be confirmed. Refresh the page to check.'); }).then(function (j) { return { ok: r.ok, r: r, j: j }; }); })
          .then(function (res) {
            if (!res.ok) { say(plainError(res.r, 'match the job description'), false); return; }
            say('', true);
            renderMatches(res.j.matches || []);
          })
          .catch(function (e) { say(plainError(e, 'match the job description'), false); });
      });

      results.addEventListener('click', function (e) {
        var btn = e.target.closest('.jd-hire-btn');
        if (!btn) return;
        var pack = btn.dataset.pack;
        var ask = fetch('/api/v1/fleets').then(function (r) { return r.ok ? r.json() : { fleets: [] }; })
          .catch(function () { return { fleets: [] }; })
          .then(function (data) {
            var teams = (data.fleets || []).map(function (f) { return f.name; }).filter(Boolean);
            var fields = [];
            if (teams.length) fields.push({ key: 'existing', label: 'Team', type: 'select',
              options: [{ value: '', label: 'Create a new team…' }].concat(teams.map(function (t) { return { value: t, label: t }; })),
              default: teams[0] });
            fields.push({ key: 'team', label: teams.length ? 'New team name (only if creating one)' : 'New team name',
              type: 'text', required: !teams.length, placeholder: 'Finance team' });
            return mvForm('Add ' + humanName(pack) + ' to a team', fields, { okText: 'Add' });
          });
        ask.then(function (vals) {
          var team = vals && ((vals.existing || '').trim() || (vals.team || '').trim());
          if (!team) return;
          fetch('/api/v1/fleets/' + encodeURIComponent(team) + '/agents', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pack: pack }),
          }).then(function (r) { return r.json().catch(function () { throw new Error('The result could not be confirmed. Refresh the page to check.'); }).then(function (j) { return { ok: r.ok, r: r, j: j }; }); })
            .then(function (res) {
              if (res.ok) say(humanName(pack) + ' added to the team “' + team + '”.', true);
              else say(plainError(res.r, 'add it to the team'), false);
            })
            .catch(function (e) { say(plainError(e, 'add it to the team'), false); });
        });
      });

      if (draftBtn) draftBtn.addEventListener('click', function () {
        var text = (jdText.value || '').trim();
        if (!text) { say('Paste the job description first — the draft is built from it.', false); return; }
        var ask = mvForm('Draft a new specialist', [
              { key: 'title', label: 'Role title', type: 'text', required: true,
                placeholder: 'e.g. Accounts Payable Specialist' },
            ], { okText: 'Draft' });
        ask.then(function (vals) {
          var title = vals && (vals.title || '').trim();
          if (!title) return;
          say('Drafting a new specialist from the job description…', true);
          fetch('/api/v1/agents/jd/draft', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role_title: title, jd_text: text }),
          }).then(function (r) { return r.json().catch(function () { throw new Error('The result could not be confirmed. Refresh the page to check.'); }).then(function (j) { return { ok: r.ok, r: r, j: j }; }); })
            .then(function (res) {
              if (!res.ok) { say(plainError(res.r, 'draft the specialist'), false); return; }
              sessionStorage.setItem('jd-draft', JSON.stringify(res.j.draft || {}));
              location.href = '/agents?new=1#agent-form';
            })
            .catch(function (e) { say(plainError(e, 'draft the specialist'), false); });
        });
      });
    })();

    // ---- tool chips: sync a friendly chip UI into the hidden #f-allow input ----
    (function () {
      var host = document.getElementById('skill-chips');
      var input = document.getElementById('f-allow');
      if (!host || !input) return;
      var SUGGEST = ['web_search', 'email', 'browser', 'read_file', 'list_dir', 'write_file', 'code_exec', 'shell'];
      var sel = (input.value || '').split(/\s+/).filter(Boolean);
      var installed = null;

      function sync() { input.value = sel.join(' '); }
      function render() {
        host.textContent = '';
        var seen = {};
        sel.forEach(function (t) { seen[t] = 1; addChip(t, true); });
        SUGGEST.forEach(function (t) { if (installed && installed.has(t) && !seen[t]) addChip(t, false); });
        var add = document.createElement('button');
        add.type = 'button'; add.className = 'chip add'; add.textContent = '+ Add another action';
        add.addEventListener('click', async function () {
          var tools = await toolChoices();
          if (!tools.length) { mvToast('The list of actions could not be loaded. Try again in a moment.', { error: true }); return; }
          var vals = await mvForm('Allow another action', [
            { key: 'name', label: 'Action', type: 'select', required: true,
              options: tools.filter(function (t) { return sel.indexOf(t.value) === -1; }) },
          ], { okText: 'Allow' });
          if (vals === null) return;
          var name = (vals.name || '').trim();
          if (name && sel.indexOf(name) === -1) { sel.push(name); sync(); render(); }
        });
        host.appendChild(add);
      }
      function addChip(tool, on) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'chip' + (on ? ' on' : '');
        if (on) { var t = document.createElement('span'); t.className = 'tick'; t.textContent = '✓'; b.appendChild(t); }
        var labels = { web_search: 'Search the web', email: 'Email', browser: 'Browse websites',
          read_file: 'Read files', list_dir: 'Find files', write_file: 'Change files',
          code_exec: 'Run code', shell: 'Run commands' };
        b.appendChild(document.createTextNode((installed && !installed.has(tool) ? 'Unavailable: ' : '')
          + (labels[tool] || humanName(tool))));
        b.setAttribute('aria-pressed', String(on));
        b.addEventListener('click', function () {
          var i = sel.indexOf(tool);
          if (i === -1) sel.push(tool); else sel.splice(i, 1);
          sync(); render();
        });
        host.appendChild(b);
      }
      render();
      toolChoices().then(function (tools) {
        installed = tools.length ? new Set(tools.map(function (tool) { return tool.value; })) : null;
        render();
      });
    })();

    // ---- risk segmented control -> hidden #f-risk select ----
    (function () {
      var seg = document.getElementById('risk-seg');
      var sel = document.getElementById('f-risk');
      if (!seg || !sel) return;
      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-risk]');
        if (!b) return;
        sel.value = b.dataset.risk;
        seg.querySelectorAll('button').forEach(function (x) {
          x.classList.toggle('on', x === b);
          x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
        });
      });
    })();

    // ---- "require approval" toggle: reflect + apply a review gate on save ----
    (function () {
      var t = document.getElementById('g-approval');
      var steps = document.getElementById('wf-steps');
      if (!t) return;
      // On load: if any workflow step already carries an approval/review gate, show it on.
      if (steps) {
        var gated = Array.prototype.some.call(steps.querySelectorAll('.wf-gate'),
          function (g) { return g.value === 'approval' || g.value === 'review'; });
        t.setAttribute('aria-pressed', gated ? 'true' : 'false');
      }
      t.addEventListener('click', function () {
        t.setAttribute('aria-pressed', t.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      });
      window.__afApprovalOn = function () { return t.getAttribute('aria-pressed') === 'true'; };
    })();

    // ---- departments roster (real: /api/v1/departments + deploy) ----
    (function () {
      var host = document.getElementById('dept-roster');
      if (!host) return;
      // Quote-safe: escapes " and ' too, so values are safe in both element
      // content and double/single-quoted attributes (data-key etc.).
      function esc(s) {
        return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
          return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
        });
      }
      function initials(s) { return (s || '?').trim().slice(0, 2).toUpperCase(); }
      // A member pack name like "aero_supplier_quality_aero" reads as
      // "supplier quality" on the card: strip the suite prefix + underscores.
      function memberLabel(name, key) {
        var s = String(name || '');
        var prefix = s.indexOf('_') > 0 ? s.slice(0, s.indexOf('_') + 1) : '';
        if (prefix && key && key.indexOf(prefix.slice(0, -1)) === 0) s = s.slice(prefix.length);
        else if (prefix) s = s.slice(prefix.length);
        return s.replace(/_/g, ' ');
      }
      function showDeployed(msg) {
        if (!msg) return;
        var link = document.createElement('a');
        link.href = '/fleets';
        link.textContent = 'Open Fleets';
        msg.style.color = 'var(--accent)';
        msg.replaceChildren(document.createTextNode('Team set up. '), link,
          document.createTextNode(' to give it work.'));
      }
      function blockedTeam(d) {
        return Number.isInteger(d.ready_specialists) && Number.isInteger(d.unknown_specialists)
          && d.ready_specialists === 0 && d.unknown_specialists === 0;
      }
      function readinessText(d, total) {
        if (!Number.isInteger(d.ready_specialists)) return '';
        return d.ready_specialists + ' of ' + total + ' can start'
          + (d.unknown_specialists ? '; ' + d.unknown_specialists + ' need a setup check' : '');
      }
      function render(list) {
        if (!list.length) {
          var title = 'No departments yet', body = 'Your specialist packs appear here as teams you can deploy. Open Workforce to see what each department covers.';
          if (window.mvEmpty) host.replaceChildren(window.mvEmpty(title, body, { label: 'Open Workforce', href: '/workforce' }, { compact: true }));
          else host.textContent = title + '. ' + body;
          return;
        }
        host.innerHTML = list.map(function (d) {
          var members = d.members || [];
          var n = members.length || d.headcount || 0;
          var preview = members.slice(0, 3).map(function (m) { return memberLabel(m, d.key); }).join(' · ');
          if (n > 3) preview += ' +' + (n - 3) + ' more';
          var unavailable = blockedTeam(d);
          var disable = unavailable ? ' disabled title="Set up at least one specialist before deploying this team"' : '';
          var deploy = d.entitled
            ? '<button type="button" class="btn dep-deploy" data-key="' + esc(d.key) + '" aria-label="Deploy ' + esc(d.title) + ' team" style="font-size:var(--text-sm);"' + disable + '>Deploy team</button>'
            : '<button type="button" class="btn dep-deploy" data-key="' + esc(d.key) + '" aria-label="Deploy ' + esc(d.title) + ' team" style="font-size:var(--text-sm);"' + disable + '>Deploy team</button><span class="dept__addon">paid add-on</span>';
          return '<div class="dept" data-key="' + esc(d.key) + '">'
            + '<div class="dept__head"><span class="dept__avatar">' + esc(initials(d.title)) + '</span>'
            + '<span><div class="dept__name">' + esc(d.title) + '</div>'
            + '<div class="dept__sub">' + esc(d.charter || (n + ' specialists')) + '</div>'
            + (readinessText(d, n) ? '<div class="dept__sub">' + esc(readinessText(d, n)) + '</div>' : '') + '</span></div>'
            + (preview ? '<p class="dept__preview">' + esc(preview) + '</p>' : '')
            + '<div class="dept__foot">' + deploy
            + '<button type="button" class="btn btn--ghost dep-details" data-key="' + esc(d.key) + '" aria-label="View ' + esc(d.title) + ' details" style="font-size:var(--text-sm);">Details</button></div>'
            + '<div class="dep-msg muted" role="status" aria-live="polite" style="font-size:var(--text-xs);margin-top:var(--space-2);"></div>'
            + '</div>';
        }).join('');
      }
      var byKey = {};
      fetch('/api/v1/departments').then(function (r) { return r.ok ? r.json() : []; })
        .then(function (list) {
          list = Array.isArray(list) ? list : [];
          list.forEach(function (d) { byKey[d.key] = d; });
          render(list);
        })
        .catch(function () { host.innerHTML = '<p class="muted">Could not load departments.</p>'; });

      // Department details pop-out: the full roster + charter, deploy in
      // place — no page jump.
      var dlg = document.getElementById('dept-dialog');
      var dlgDeploy = document.getElementById('dept-dlg-deploy');
      var dlgKey = null;
      function openDept(key) {
        var d = byKey[key];
        if (!d || !dlg) return;
        dlgKey = key;
        document.getElementById('dept-dlg-avatar').textContent = initials(d.title);
        document.getElementById('dept-dlg-title').textContent = d.title || key;
        var members = d.members || [];
        var n = members.length || d.headcount || 0;
        document.getElementById('dept-dlg-sub').textContent =
          n + ' specialist' + (n === 1 ? '' : 's') +
          (readinessText(d, n) ? ' · ' + readinessText(d, n) : '') +
          (d.entitled ? '' : ' · paid add-on');
        document.getElementById('dept-dlg-charter').textContent = d.charter || '';
        var ul = document.getElementById('dept-dlg-members');
        ul.innerHTML = '';
        members.forEach(function (m) {
          var li = document.createElement('li');
          li.textContent = memberLabel(m, d.key);
          ul.appendChild(li);
        });
        if (!members.length) {
          var li = document.createElement('li');
          li.className = 'muted';
          li.textContent = 'Roster loads on deploy.';
          ul.appendChild(li);
        }
        document.getElementById('dept-dlg-msg').textContent = '';
        dlgDeploy.disabled = dlgDeploy.dataset.inFlight === 'true' || blockedTeam(d);
        dlgDeploy.setAttribute('aria-label', 'Deploy ' + (d.title || key) + ' team');
        dlg.showModal();
      }
      host.addEventListener('click', function (e) {
        var det = e.target.closest('.dep-details');
        if (det) { openDept(det.dataset.key); return; }
        var card = e.target.closest('.dept');
        if (card && !e.target.closest('button') && !e.target.closest('a')) openDept(card.dataset.key);
      });
      document.getElementById('dept-dlg-close').addEventListener('click', function () { dlg.close(); });
      dlgDeploy.addEventListener('click', async function () {
        if (!dlgKey) return;
        if (dlgDeploy.dataset.inFlight === 'true') return;
        dlgDeploy.dataset.inFlight = 'true';
        var title = (byKey[dlgKey] && byKey[dlgKey].title) || dlgKey;
        if (!(await mvConfirm(
          'Set up the ' + title + ' team? This adds its specialists so you can give the team work.',
          { okText: 'Deploy team' }
        ))) { delete dlgDeploy.dataset.inFlight; return; }
        var msg = document.getElementById('dept-dlg-msg');
        dlgDeploy.disabled = true;
        dlgDeploy.setAttribute('aria-busy', 'true');
        msg.style.color = 'var(--muted)'; msg.textContent = 'Deploying…';
        fetch('/api/v1/departments/' + encodeURIComponent(dlgKey) + '/deploy',
              { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
          .then(function (r) { return r.json().catch(function () { throw new Error('The result could not be confirmed. Refresh the page to check whether the team was set up.'); }).then(function (j) { return { ok: r.ok || r.status === 201, status: r.status, j: j }; }); })
          .then(function (res) {
            if (res.ok) showDeployed(msg);
            else { msg.style.color = 'var(--danger)'; msg.textContent = plainError(res, 'set up the team'); }
          })
          .catch(function (error) {
            msg.style.color = 'var(--danger)';
            msg.textContent = error && error.name !== 'TypeError' && error.message
              ? error.message
              : plainError(error, 'set up the team');
          })
          .finally(function () {
            delete dlgDeploy.dataset.inFlight;
            dlgDeploy.removeAttribute('aria-busy');
            dlgDeploy.disabled = false;
          });
      });

      host.addEventListener('click', async function (e) {
        var btn = e.target.closest('.dep-deploy');
        if (!btn) return;
        if (btn.dataset.inFlight === 'true') return;
        btn.dataset.inFlight = 'true';
        var card = btn.closest('.dept');
        var msg = card && card.querySelector('.dep-msg');
        var title = (byKey[btn.dataset.key] && byKey[btn.dataset.key].title) || btn.dataset.key;
        if (!(await mvConfirm(
          'Set up the ' + title + ' team? This adds its specialists so you can give the team work.',
          { okText: 'Deploy team' }
        ))) { delete btn.dataset.inFlight; return; }
        btn.disabled = true; btn.setAttribute('aria-busy', 'true');
        if (msg) { msg.style.color = 'var(--muted)'; msg.textContent = 'Deploying…'; }
        fetch('/api/v1/departments/' + encodeURIComponent(btn.dataset.key) + '/deploy',
              { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
          .then(function (r) { return r.json().catch(function () { throw new Error('The result could not be confirmed. Refresh the page to check whether the team was set up.'); }).then(function (j) { return { ok: r.ok || r.status === 201, status: r.status, j: j }; }); })
          .then(function (res) {
            if (res.ok) showDeployed(msg);
            else if (msg) { msg.style.color = 'var(--danger)'; msg.textContent = plainError(res, 'set up the team'); }
          })
          .catch(function (error) {
            if (msg) {
              msg.style.color = 'var(--danger)';
              msg.textContent = error && error.name !== 'TypeError' && error.message
                ? error.message
                : plainError(error, 'set up the team');
            }
          })
          .finally(function () {
            delete btn.dataset.inFlight;
            btn.removeAttribute('aria-busy');
            btn.disabled = false;
          });
      });
    })();
    mountToolPicks();
  </script>

  {% if (selected or creating) and editable %}
  <script>
    // ---- save / validate / reset (real agent-override endpoints) ----
    (function () {
      const form = document.getElementById('agent-form');
      if (!form) return;
      const creating = form.dataset.creating === '1';
      const idInput = document.getElementById('f-new-id');
      const msg = document.getElementById('agent-msg');
      // The target agent name: the pre-selected pack, or (new mode) the id typed
      // in. Normalized to the lowercase/underscore shape packs use.
      function targetName() {
        if (!creating) return form.dataset.name;
        return (idInput ? idInput.value : '').trim().toLowerCase().replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
      }
      const words = (s) => s.split(/\s+/).filter(Boolean);
      function show(text, ok) { msg.textContent = text; msg.style.color = ok ? 'var(--accent)' : 'var(--danger)'; }

      const stepsEl = document.getElementById('wf-steps');
      const addBtn = document.getElementById('wf-add');
      if (addBtn) addBtn.addEventListener('click', () => {
        stepsEl.appendChild(document.getElementById('wf-row-tpl').content.cloneNode(true));
        mountToolPicks();
      });
      mountToolPicks();
      // The short name follows the specialist's name until someone edits it.
      const descInput = document.getElementById('f-description');
      let idTouched = false;
      if (idInput) idInput.addEventListener('input', () => { idTouched = !!idInput.value.trim(); });
      if (idInput && descInput) descInput.addEventListener('input', () => {
        if (!idTouched) idInput.value = descInput.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').slice(0, 4).join(' ');
      });
      if (stepsEl) stepsEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button'); if (!btn) return;
        const row = btn.closest('.wf-step');
        if (btn.classList.contains('wf-del')) row.remove();
        else if (btn.classList.contains('wf-up') && row.previousElementSibling)
          row.parentNode.insertBefore(row, row.previousElementSibling);
        else if (btn.classList.contains('wf-down') && row.nextElementSibling)
          row.parentNode.insertBefore(row.nextElementSibling, row);
      });

      function gatherWorkflow() {
        const steps = [];
        stepsEl && stepsEl.querySelectorAll('.wf-step').forEach((row) => {
          const stepName = row.querySelector('.wf-name').value.trim();
          if (!stepName) return;
          steps.push({
            name: stepName,
            instruction: row.querySelector('.wf-instruction').value,
            tools: words(row.querySelector('.wf-tools').value),
            gate: row.querySelector('.wf-gate').value || null,
          });
        });
        // "Require approval to finish": gate the final step (or add a review step).
        if (window.__afApprovalOn && window.__afApprovalOn()) {
          if (steps.length) { if (!steps[steps.length - 1].gate) steps[steps.length - 1].gate = 'review'; }
          else steps.push({ name: 'Final review', instruction: 'Human sign-off before finishing.', tools: [], gate: 'review' });
        }
        return steps;
      }

      function payload() {
        const autoBox = document.getElementById('agent-autonomy');
        const policy = autoBox && {
          default: document.getElementById('f-auto-default').value,
          low: document.getElementById('f-auto-low').value || null,
          medium: document.getElementById('f-auto-medium').value || null,
          high: document.getElementById('f-auto-high').value || null,
          onboarding: document.getElementById('f-auto-onboarding').checked,
        };
        let autonomy = null;
        if (policy && autoBox.dataset.configOverride === '1') {
          // The server policy wins. Preserve an existing pack setting without
          // copying the server's higher-priority values into the tenant pack.
          if (autoBox.dataset.overridden === '1') autonomy = JSON.parse(autoBox.dataset.pack);
        } else if (policy) {
          const changed = policy.default !== autoBox.dataset.default ||
            (policy.low || '') !== autoBox.dataset.low ||
            (policy.medium || '') !== autoBox.dataset.medium ||
            (policy.high || '') !== autoBox.dataset.high ||
            String(policy.onboarding) !== autoBox.dataset.onboarding;
          if (changed || autoBox.dataset.overridden === '1') autonomy = policy;
        }
        return {
          expected_generation: creating ? 'new' : form.dataset.generation,
          description: document.getElementById('f-description').value,
          persona: document.getElementById('f-persona').value,
          allow_tools: words(document.getElementById('f-allow').value),
          deny_tools: words(document.getElementById('f-deny').value),
          max_risk: document.getElementById('f-risk').value,
          workflow: gatherWorkflow(),
          ...(autonomy ? { autonomy } : {}),
        };
      }
      function beginMutation(button) {
        if (button.dataset.inFlight === 'true') return false;
        button.dataset.inFlight = 'true';
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
        return true;
      }
      function finishMutation(button) {
        delete button.dataset.inFlight;
        button.removeAttribute('aria-busy');
        button.disabled = false;
      }
      async function call(method, path, body) {
        const opts = { method, headers: {} };
        if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
        let r;
        try { r = await fetch(path, opts); }
        catch (error) { throw new Error(plainError(error, 'reach Lightwork')); }
        if (!r.ok) throw new Error(plainError(r, 'save these settings'));
        let data;
        try { data = await r.json(); }
        catch (e) { throw new Error('The result could not be confirmed. Refresh the page to check.'); }
        return { status: r.status, data };
      }
      document.getElementById('btn-validate').addEventListener('click', async () => {
        try {
          const name = targetName();
          if (!name) { show('Give your specialist a name first.', false); return; }
          const { data } = await call('POST', `/api/v1/agents/${name}/validate`, payload());
          if (data.errors && data.errors.length) show('Needs changes: ' + data.errors.join('; '), false);
          else if (data.warnings && data.warnings.length) show('Looks good, with notes: ' + data.warnings.join('; '), true);
          else show('Looks good.', true);
        } catch (error) {
          show(error instanceof Error ? error.message : 'Request failed.', false);
        }
      });
      const saveBtn = document.getElementById('btn-save');
      saveBtn.addEventListener('click', async () => {
        const name = targetName();
        if (!name) { show('Give your specialist a name first.', false); return; }
        if (!beginMutation(saveBtn)) return;
        try {
          if (!(await mvConfirm(
            (creating ? 'Create the specialist “' : 'Save the specialist “') + name + '”? Its allowed actions, steps and independence settings take effect for everyone who uses it.',
            { okText: creating ? 'Create agent' : 'Deploy specialist' }
          ))) return;
          await call('POST', `/api/v1/agents/${name}/override`, payload());
          show(creating ? 'Custom agent created.' : 'Deployed.', true);
          window.location.search = '?name=' + encodeURIComponent(name);
        } catch (error) {
          show(error instanceof Error ? error.message : 'Request failed.', false);
        } finally {
          finishMutation(saveBtn);
        }
      });
      const resetBtn = document.getElementById('btn-reset');
      if (resetBtn) resetBtn.addEventListener('click', async () => {
        const name = targetName();
        if (!name || !beginMutation(resetBtn)) return;
        try {
          if (!(await mvConfirm(
            'Reset “' + name + '” to how it came? This removes your limits on allowed actions, risk, blocked actions and independence. The built-in policy may allow more. Review its policy after resetting.',
            { okText: 'Reset specialist' }
          ))) return;
          await call('DELETE', `/api/v1/agents/${name}/override?expected_generation=${encodeURIComponent(form.dataset.generation)}`);
          show('Reset to how it came.', true);
          window.location.search = '?name=' + encodeURIComponent(name);
        } catch (error) {
          show(error instanceof Error ? error.message : 'Request failed.', false);
        } finally {
          finishMutation(resetBtn);
        }
      });
    })();
  </script>
  {% endif %}

  <dialog id="jobcard-dlg" aria-labelledby="jc-name">
    <div class="jc-wrap">
      <div class="jc-head">
        <div>
          <h2 id="jc-name">…</h2>
          <div class="jc-role" id="jc-role"></div>
        </div>
        <button type="button" class="btn btn--ghost jc-close" id="jc-close">Close</button>
      </div>
      <div class="jc-sec"><h3>Can this specialist start?</h3>
        <p><strong>{{ selected.readiness.label }}</strong></p>
        {% if selected.readiness.state == 'needs_setup' %}
        <p class="muted">Required actions: {{ selected.readiness.missing_labels | join(', ') }}. <a href="{{ selected.readiness.fix_url }}">Review setup</a></p>
        {% elif selected.readiness.state == 'unknown' %}
        <p class="muted">Lightwork could not check the required actions. Ask an administrator to review setup before assigning work.</p>
        {% else %}
        <p class="muted">This checks required actions only; live connections, permissions and the AI service are checked when work starts.</p>
        {% endif %}
      </div>
      <div class="jc-sec"><h3>Independence</h3>
        {% if selected.autonomy.levels_enabled %}
        {% set level_names = {'observe': 'Watch only', 'suggest': 'Suggest', 'request': 'Ask before acting', 'auto': 'Act on its own'} %}
        <p>Current levels: low-risk actions — {{ level_names[selected.autonomy.effective.low] }};
          medium-risk actions — {{ level_names[selected.autonomy.effective.medium] }};
          high-risk actions — {{ level_names[selected.autonomy.effective.high] }}.</p>
        {% if selected.autonomy.onboarding %}<p class="muted">Supervision is on, so the chosen levels are lowered one step.</p>{% endif %}
        {% else %}
        <p>Independence levels are off. Consequential actions are staged for a person.</p>
        {% endif %}
        {% if editable %}<p><a href="#agent-autonomy" id="jc-autonomy-open">Review independence settings</a></p>{% endif %}
      </div>
      <div class="jc-cards" id="jc-stats"></div>
      <div class="jc-sec"><h3>Cost level</h3>
        <div class="jc-tier">
          <span class="jc-band" id="jc-band"></span>
          <span class="sub" id="jc-model"></span>
          <span style="margin-inline-start:auto;"></span>
          <label class="sub" for="jc-band-set">Cost level</label>
          <select id="jc-band-set" class="ctl">
            <option value="">Automatic</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="very_high">Very High</option>
          </select>
        </div>
      </div>
      <div class="jc-sec"><h3>Mission</h3><p id="jc-mission"></p></div>
      <div class="jc-sec"><h3>Responsibilities</h3><ol class="jc-steps" id="jc-resp"></ol></div>
      <div class="jc-grid2">
        <div class="jc-sec"><h3>Delivers</h3><p id="jc-deliver"></p></div>
        <div class="jc-sec"><h3>Guardrails — never does</h3><div class="jc-chips" id="jc-guard"></div></div>
      </div>
      <div class="jc-sec"><h3>Tools it can use</h3><div class="jc-chips" id="jc-tools"></div></div>
    </div>
  </dialog>
  <script>
  (function () {
    'use strict';
    var NAME = {{ selected.name | tojson }};
    var dlg = document.getElementById('jobcard-dlg');
    var CAN_SET = false;
    function el(id){ return document.getElementById(id); }
    function chips(box, items, cls){
      box.textContent='';
      (items||[]).forEach(function(t){
        var s=document.createElement('span'); s.className='jc-chip'+(cls?' '+cls:'');
        s.textContent=t; box.appendChild(s);
      });
      if(!(items||[]).length){ box.textContent='—'; }
    }
    function stat(n,l){ return '<div class="jc-stat"><div class="n">'+n+
      '</div><div class="l">'+l+'</div></div>'; }
    function money(v){ return v==null?'—':window.mvMoney?window.mvMoney(v):'$'+Number(v).toLocaleString(undefined,{maximumFractionDigits:0}); }
    function render(d){
      var jd=d.job_description||{}, sc=d.scorecard||{}, ct=d.cost_tier||{};
      el('jc-name').textContent=jd.name||NAME;
      el('jc-role').textContent=(jd.role||'')+(jd.suite?(' · '+jd.suite):'');
      el('jc-mission').textContent=jd.mission||'—';
      var resp=el('jc-resp'); resp.textContent='';
      (jd.responsibilities||[]).forEach(function(w){
        var li=document.createElement('li'); li.textContent=w.name?(w.name+' — '+(w.instruction||'')):String(w); resp.appendChild(li);
      });
      if(!(jd.responsibilities||[]).length){ resp.innerHTML='<li class="sub">No steps listed yet.</li>'; }
      el('jc-deliver').textContent=(jd.deliverable||'—')+
        (jd.cadence?(' · '+jd.cadence):'')+(jd.gate?(' · needs '+(jd.gate==='approval'?'someone to approve':'someone to review')):'');
      chips(el('jc-tools'), (jd.tools||[]).map(function(t){ return window.mvHuman?mvHuman(t):t; }));
      chips(el('jc-guard'), jd.guardrails, 'deny');
      el('jc-stats').innerHTML =
        stat(money(sc.value), 'Value delivered') +
        stat(money(sc.cost), 'Cost') +
        stat(sc.roi_multiple!=null?(sc.roi_multiple+'×'):'—', 'ROI') +
        stat(sc.success_rate!=null?(sc.success_rate+'%'):'—', 'Success rate');
      var band=ct.band||'medium';
      var b=el('jc-band'); b.className='jc-band '+band; b.textContent=(ct.label||band)+' cost';
      el('jc-model').textContent=(ct.overridden?'Set by hand':'Chosen automatically')+
        (ct.blended_rate!=null?(' · about '+money(ct.blended_rate)+' per million words'):'');
      el('jc-band-set').value=ct.overridden?band:'';
      el('jc-band-set').dataset.model=ct.model||'';
    }
    function open(){
      dlg.showModal();
      el('jc-name').textContent='Loading…';
      fetch('/api/v1/agents/'+encodeURIComponent(NAME)+'/jobcard')
        .then(function(r){ return r.json(); }).then(render)
        .catch(function(){ el('jc-name').textContent='Could not load the job card. Close it and try again.'; });
    }
    var btn=el('btn-jobcard'); if(btn) btn.addEventListener('click', open);
    var autoLink=el('jc-autonomy-open'); if(autoLink) autoLink.addEventListener('click', function(){ dlg.close(); });
    el('jc-close').addEventListener('click', function(){ dlg.close(); });
    dlg.addEventListener('click', function(e){ if(e.target===dlg) dlg.close(); });
    el('jc-band-set').addEventListener('change', function(){
      var model=this.dataset.model; if(!model) return;
      var band=this.value||null;
      fetch('/api/v1/model-cost-tiers', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:model, band:band})})
        .then(function(r){ if(r.ok) return r.json(); throw r; })
        .then(function(ct){
          var b=el('jc-band'); b.className='jc-band '+ct.band; b.textContent=(ct.label||ct.band)+' cost';
          el('jc-model').textContent=(ct.overridden?'Set by hand':'Chosen automatically')+
            (ct.blended_rate!=null?(' · about '+money(ct.blended_rate)+' per million words'):'');
        })
        .catch(function(e){ window.mvFail ? mvFail(e, 'change the cost level') : null; });
    });
  })();
  </script>
  {% endif %}
<script src="/static/lightwork-business-agent.js" defer></script>
{% endblock %}
