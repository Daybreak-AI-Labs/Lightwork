<style nonce="{{ csp_style_nonce }}">
  .ic-shell{display:grid;gap:var(--space-5)}
  .ic-card{background:var(--panel);border:1px solid color-mix(in srgb,var(--text) 14%,transparent);border-radius:1rem;padding:clamp(1rem,2vw,1.4rem);min-width:0}
  .ic-kicker{color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.12em;margin:0 0 .4rem;text-transform:uppercase}
  .ic-lede,.ic-help{color:var(--text-muted);line-height:1.55;margin:.35rem 0}
  .ic-metrics{display:grid;gap:var(--space-3);grid-template-columns:repeat(4,minmax(0,1fr))}
  .ic-metric strong{display:block;font-size:1.5rem}.ic-metric span{color:var(--text-muted);font-size:.8rem}
  .ic-grid{display:grid;gap:var(--space-4);grid-template-columns:repeat(2,minmax(0,1fr))}
  .ic-wide{grid-column:1/-1}
  .ic-table-wrap{max-height:28rem;overflow:auto}
  .ic-table{border-collapse:collapse;font-size:.8rem;width:100%}
  .ic-table th,.ic-table td{border-bottom:1px solid color-mix(in srgb,var(--text) 12%,transparent);padding:.5rem;text-align:left;vertical-align:top}
  .ic-table td{color:var(--text-muted);word-break:break-word}
  .ic-table caption{caption-side:top;color:var(--text-muted);padding:0 0 .5rem;text-align:left}
  .ic-state[data-ok=false]{color:var(--danger,#f06b75)}.ic-state[data-ok=true]{color:var(--success,#45c786)}
  @media(max-width:900px){.ic-grid{grid-template-columns:1fr}.ic-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
