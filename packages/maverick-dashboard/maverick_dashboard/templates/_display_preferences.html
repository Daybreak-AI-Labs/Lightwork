      <details class="prefs" id="prefs-menu">
        <summary class="iconbtn" aria-label="Display preferences" title="Display preferences">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5h3.4M10.4 5h3.1M2.5 11h6.3M13.1 11h.4"/><circle cx="7.7" cy="5" r="1.7"/><circle cx="10.8" cy="11" r="1.7"/></svg>
        </summary>
        <div class="prefs__panel" role="group" aria-label="Display preferences">
          <label class="prefs__row"><span>Save on this device only</span><input type="checkbox" id="prefs-device-only" {% if not display_signed_in %}checked{% endif %}></label>
          <label class="prefs__row"><span>Text size</span><select class="ctl" data-ui-preference="text_size" aria-label="Text size">
            {% for size, label in [('standard', 'Standard'), ('large', 'Large'), ('larger', 'Larger')] %}<option value="{{ size }}" {% if display_text_size == size %}selected{% endif %}>{{ label }}</option>{% endfor %}
          </select></label>
          <p id="prefs-status" role="status" aria-live="polite"></p>
          <button type="button" class="btn btn--ghost" id="prefs-undo" hidden>Undo appearance change</button>
          <label class="prefs__row"><span>Theme</span>
      <select class="ctl" id="theme-select" data-ui-preference="theme" aria-label="Theme">
        <option value="">Theme</option>
        <option value="system" {% if theme == 'system' %}selected{% endif %}>Follow system</option>
        <option value="dark" {% if theme == 'dark' %}selected{% endif %}>Dark</option>
        <option value="light" {% if theme == 'light' %}selected{% endif %}>Light</option>
        <option value="solarized" {% if theme == 'solarized' %}selected{% endif %}>Solarized</option>
        <option value="hicontrast" {% if theme == 'hicontrast' %}selected{% endif %}>High contrast</option>
        {% for name in custom_theme_names %}
        <option value="{{ name }}" {% if theme == name %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
          </label>
          <label class="prefs__row"><span>Density</span>
      <select class="ctl" id="density-select" data-ui-preference="density" aria-label="Density">
        <option value="">Density</option>
        <option value="comfortable" {% if density == 'comfortable' %}selected{% endif %}>Comfortable</option>
        <option value="compact" {% if density == 'compact' %}selected{% endif %}>Compact</option>
      </select>
          </label>
          <label class="prefs__row"><span{% if lang and page_lang and lang != page_lang %} lang="{{ lang }}"{% endif %}>{{ t('label.font') }}</span>
      <select class="ctl" id="font-select" data-ui-preference="font" aria-label="{{ t('label.font') }}"{% if lang and page_lang and lang != page_lang %} lang="{{ lang }}"{% endif %}>
        <option value="">{{ t('label.font') }}</option>
        <option value="default" {% if font == 'default' %}selected{% endif %}>{{ t('font.default') }}</option>
        <option value="dyslexic" {% if font == 'dyslexic' %}selected{% endif %}>{{ t('font.dyslexic') }}</option>
      </select>
          </label>
        </div>
      </details>
