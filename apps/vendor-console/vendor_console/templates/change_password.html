{% extends "base.html" %}
{% block title %}Change my password · Daybreak Console{% endblock %}
{% block main %}
<h1>Change my password</h1>
<p class="sub">After you change it, you'll stay signed in here and be signed out everywhere else.</p>
{% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
<div class="card confirm-card">
  <form method="post" action="/account/password">
    <input type="text" name="username" value="{{ staff.email }}" autocomplete="username" hidden aria-hidden="true" tabindex="-1" aria-label="Email">
    <label for="pw-current">Current password</label>
    <input id="pw-current" name="current" type="password" autocomplete="current-password" required>
    <label for="pw-new">New password <span class="muted">(at least 10 characters)</span></label>
    <input id="pw-new" name="password" type="password" minlength="10" autocomplete="new-password" required>
    <label for="pw-confirm">Type the new password again</label>
    <input id="pw-confirm" name="confirm" type="password" minlength="10" autocomplete="new-password" required>
    <div class="actions"><button class="btn" type="submit">Change password</button></div>
  </form>
</div>
{% endblock %}
