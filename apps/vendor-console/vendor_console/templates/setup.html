{% extends "base.html" %}
{% block title %}Welcome · Daybreak Console{% endblock %}
{% block auth %}
<div class="auth-card">
  <div class="brand">◐ Daybreak<span>Customer administration</span></div>
  <p class="sub">Welcome. Create the first owner account. The owner can add the rest of the team later.</p>
  {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/setup">
    <label for="console-setup-email">Work email</label>
    <input id="console-setup-email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="console-setup-name">Your name</label>
    <input id="console-setup-name" name="name" type="text">
    <label for="console-setup-password">Password <span class="muted">(at least 10 characters)</span></label>
    <input id="console-setup-password" name="password" type="password" autocomplete="new-password" minlength="10" required>
    <button class="btn" type="submit">Create owner account</button>
  </form>
</div>
{% endblock %}
