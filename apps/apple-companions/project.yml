name: LightworkCompanions
options:
  minimumXcodeGenVersion: 2.42.0
  xcodeVersion: '16.0'
  developmentLanguage: en
  deploymentTarget:
    watchOS: '10.0'
    visionOS: '1.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Manual
packages:
  LightworkConnectionKit:
    path: ../apple-companion-core
targets:
  MaverickGlance:
    type: application
    platform: watchOS
    sources: [../watch-glance/MaverickGlance]
    dependencies:
      - package: LightworkConnectionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.maverick.glance
        INFOPLIST_KEY_CFBundleDisplayName: Lightwork Preview
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
    scheme:
      testTargets: [MaverickGlanceTests]
  MaverickGlanceTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [../watch-glance/Tests]
    dependencies:
      - target: MaverickGlance
      - package: LightworkConnectionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.maverick.glance.tests
  MaverickPlanTree:
    type: application
    platform: visionOS
    sources: [../visionos-plan-tree/MaverickPlanTree]
    dependencies:
      - package: LightworkConnectionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.maverick.plantree
        INFOPLIST_KEY_CFBundleDisplayName: Lightwork Preview
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    scheme:
      testTargets: [MaverickPlanTreeTests]
  MaverickPlanTreeTests:
    type: bundle.unit-test
    platform: visionOS
    sources: [../visionos-plan-tree/Tests]
    dependencies:
      - target: MaverickPlanTree
      - package: LightworkConnectionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.maverick.plantree.tests
