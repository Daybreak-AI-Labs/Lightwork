[package]
name = "maverick-zed-extension"
version = "0.1.6"
edition = "2021"
description = "Zed editor extension for the Lightwork agent runtime"
authors = ["cdayAI"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/Daybreak-AI-Labs/Lightwork"

[lib]
# Zed loads extensions as WASM components; cdylib is the required crate type.
crate-type = ["cdylib"]

[dependencies]
# Keep the extension's WIT/API generation explicit; Cargo.lock pins transitive inputs.
zed_extension_api = "=0.7.0"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
