<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Agent Trust Auditor{% endblock %}</title>
  <style>
    body{font:16px system-ui;margin:0;background:#07111f;color:#e6edf7}
    header,main{max-width:1100px;margin:auto;padding:1rem}
    header{display:flex;justify-content:space-between}
    a{color:#72b7ff}.hero,.card{background:#101e30;border:1px solid #29415f;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
    .tag{color:#8bd5ca}li{margin:.45rem 0}code{overflow-wrap:anywhere}:focus-visible{outline:3px solid #f5c76b;outline-offset:2px}
  </style>
</head>
<body>
  <header><strong>Agent Trust Auditor</strong><nav aria-label="Primary"><a href="/">Findings</a> &middot; <a href="/about">Capabilities</a></nav></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
