{{- include "maverick.validate" . -}}
{{- if .Values.migration.enabled }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "maverick.fullname" . }}-migration
  labels:
    {{- include "maverick.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "maverick.name" . }}-migration
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - {{- if .Values.networkPolicy.dnsCIDRs }}
      to:
        {{- range .Values.networkPolicy.dnsCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- end }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- range .Values.migration.allowedEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - port: {{ $.Values.migration.databasePort }}
          protocol: TCP
    {{- end }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "maverick.fullname" . }}-migration
  labels:
    {{- include "maverick.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "maverick.name" . }}-migration
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
      annotations:
        lightwork.daybreak.ai/migration-authorization-sha256: {{ .Values.migration.authorizationSha256 | quote }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      shareProcessNamespace: false
      enableServiceLinks: false
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migration.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: stage-migration-authority
          image: {{ include "maverick.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "maverick.secret_staging"]
          args:
            - "--source"
            - "/run/secrets/lightwork-migration-projected"
            - "--destination"
            - "/run/secrets/lightwork-migration-staging/custody"
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: migration-authority-projected
              mountPath: /run/secrets/lightwork-migration-projected
              readOnly: true
            - name: migration-authority-staging
              mountPath: /run/secrets/lightwork-migration-staging
            - name: migration-tmp
              mountPath: /tmp
      containers:
        - name: migrate
          image: {{ include "maverick.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "maverick.production_migration"]
          args:
            - "apply"
            - "--dsn-file"
            - "/run/secrets/lightwork-migration/MAVERICK_PG_MIGRATION_DSN"
            - "--authorization-file"
            - "/run/secrets/lightwork-migration/MAVERICK_MIGRATION_AUTHORIZATION"
            - "--authorization-sha256"
            - {{ .Values.migration.authorizationSha256 | quote }}
            - "--image-digest"
            - {{ .Values.image.digest | quote }}
            - "--release-version"
            - {{ .Chart.AppVersion | quote }}
          workingDir: /workspace
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: migration-authority-staging
              mountPath: /run/secrets/lightwork-migration
              subPath: custody
              readOnly: true
            - name: migration-tmp
              mountPath: /tmp
      volumes:
        - name: migration-authority-projected
          secret:
            secretName: {{ .Values.migration.secretName }}
            defaultMode: 0440
            items:
              - key: MAVERICK_PG_MIGRATION_DSN
                path: MAVERICK_PG_MIGRATION_DSN
              - key: MAVERICK_MIGRATION_AUTHORIZATION
                path: MAVERICK_MIGRATION_AUTHORIZATION
        - name: migration-authority-staging
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.migration.stagingSizeLimit | quote }}
        - name: migration-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
{{- end }}
