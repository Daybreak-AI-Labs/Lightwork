[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "maverick-native"
version = "0.1.0"
description = "Native (Rust) safety scanners for Lightwork — Python binding."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Lightwork Authors" }]
classifiers = ["Programming Language :: Rust"]

[project.urls]
Homepage = "https://github.com/Daybreak-AI-Labs/Lightwork"
Repository = "https://github.com/Daybreak-AI-Labs/Lightwork"
Issues = "https://github.com/Daybreak-AI-Labs/Lightwork/issues"

[tool.maturin]
module-name = "maverick_native"
# abi3 wheel works across CPython 3.10+; one wheel per platform, not per minor.
features = ["pyo3/extension-module"]
