name: Desktop bundle

# Builds the authenticated source-bootstrap shell (Tauri) for macOS, Windows,
# and Linux as an engineering workflow artifact. It is not a self-contained
# product installer and is not attached to product releases.
#
# Pressing "Install from authorized source" clones the pinned private
# repository commit. The operator therefore needs network access and valid
# GitHub authorization; the installed Python source remains readable.
#
# Status: UNSIGNED. First launch trips SmartScreen (Windows) / Gatekeeper
# (macOS) with an "unknown developer" prompt. Code signing + notarization
# are gated on an Apple Developer Program membership + a Windows signing
# cert.

on:
  workflow_dispatch: {}
  push:
    tags:
      # Engineering-only version markers. Product `v*` releases deliberately
      # do not publish these source-bootstrap bundles as customer installers.
      - 'desktop-v*'

jobs:
  bundle:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/installer-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux bundle deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.11.1 --activate

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/installer-desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/installer-desktop/src-tauri/Cargo.toml', 'apps/installer-desktop/src-tauri/Cargo.lock') }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Generate icon variants from source icon
        # Turns the committed src-tauri/icons/icon.png into the
        # platform-specific 32x32 / 128x128 / icns / ico the bundler
        # expects (referenced in tauri.conf.json).
        run: pnpm tauri icon src-tauri/icons/icon.png

      - name: Sync bundle version to the release tag
        # Bundle filenames are Lightwork_<version>_*, where <version> comes
        # from tauri.conf.json (productName "Lightwork"). That value used to be
        # hand-bumped and drifted (the v0.1.4 release shipped bundles named
        # Maverick_0.1.3_*). Derive it from the tag so the installer version
        # can never disagree with the GitHub Release again. Non-tag runs
        # keep the committed version (local/dev builds only).
        shell: bash
        run: |
          ver="$(printf '%s' "${GITHUB_REF_NAME:-}" | sed -E 's/^(desktop-)?v//')"
          case "$ver" in
            [0-9]*.[0-9]*.[0-9]*)
              node -e "const f='src-tauri/tauri.conf.json';const j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n');console.log('bundle version -> '+j.version)" "$ver"
              ;;
            *)
              echo "ref '${GITHUB_REF_NAME:-}' has no release version; keeping committed tauri.conf.json version."
              ;;
          esac

      - name: Build bundle (unsigned)
        run: pnpm tauri build -- --locked

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maverick-desktop-${{ matrix.target }}
          path: |
            apps/installer-desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/installer-desktop/src-tauri/target/release/bundle/**/*.app
            apps/installer-desktop/src-tauri/target/release/bundle/**/*.msi
            apps/installer-desktop/src-tauri/target/release/bundle/**/*.exe
            apps/installer-desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/installer-desktop/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error
