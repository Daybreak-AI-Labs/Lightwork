name: Deploy website

# Publishes the Daybreak Labs website in web/ to Cloudflare Pages (project
# daybreak-labs, served at daybreakailabs.com) on every push to main that
# touches the site, and on manual dispatch. web/widget/ (the embeddable chat
# widget, which runs on a Lightwork dashboard's own origin) and web/README.md
# are not part of the site and are left out of the upload.
#
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN  -- a token scoped to Account > Cloudflare Pages > Edit
#                            on the Daybreak Labs account.
# The account id is not a secret and is set inline below.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "!web/widget/**"
      - "!web/README.md"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Production only: a manual run from any other branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"
      - name: Stage the site
        run: |
          mkdir _site
          rsync -a --exclude 'widget/' --exclude 'README.md' web/ _site/
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a32891127c60aa86958fe0648a0893e3 # pragma: allowlist secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not set. Add it under Settings > Secrets and variables > Actions, then re-run." >&2
            exit 1
          fi
          npx --yes wrangler@4.151.1 pages deploy _site \
            --project-name=daybreak-labs --branch=main --commit-dirty=true
