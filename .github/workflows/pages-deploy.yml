name: Deploy marketing site

# Publishes website to Cloudflare Pages (project: daybreak-labs) on every
# push to main that touches the site, and on manual dispatch. This is the
# "connect the repo to Cloudflare" piece: before it, the site was published by
# hand (`wrangler pages deploy`) and a merge to main did nothing on its own.
#
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN  -- a token scoped to Account > Cloudflare Pages > Edit
#                            on the Daybreak Labs account. Create at
#                            dash.cloudflare.com > My Profile > API Tokens.
# The account id is not a secret and is set inline below.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a32891127c60aa86958fe0648a0893e3
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not set. Add it under Settings > Secrets and variables > Actions, then re-run." >&2
            exit 1
          fi
          npx --yes wrangler@4 pages deploy website \
            --project-name=daybreak-labs --branch=main --commit-dirty=true
