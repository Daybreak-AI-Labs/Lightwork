name: MCP clients

# Executes the cross-language MCP client examples against a live `maverick mcp`
# stdio server. The Python contract test (test_client_quickstart_contract.py)
# checks the documented tool surface; this proves the clients actually connect
# and round-trip -- it's what catches a broken `maverick mcp` entry point or an
# SDK/protocol drift that doc checks can't.
#
# Only the no-LLM flow runs (initialize -> tools/list -> maverick_facts_get);
# maverick_start needs a provider key + budget and is out of scope for CI.

on:
  push:
    branches: [main]
    paths:
      - 'packages/maverick-core/**'
      - 'packages/maverick-mcp/**'
      - 'examples/clients/**'
      - 'docs/clients/**'
      - '.github/workflows/mcp-clients.yml'
  pull_request:
    paths:
      - 'packages/maverick-core/**'
      - 'packages/maverick-mcp/**'
      - 'examples/clients/**'
      - 'docs/clients/**'
      - '.github/workflows/mcp-clients.yml'

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
      - name: Flow designer JS unit tests (pure serialization, no deps)
        run: node --test packages/maverick-dashboard/tests/js/*.test.js
      - name: Install Lightwork (kernel + MCP server)
        run: |
          pip install -e ./packages/maverick-core
          pip install --no-deps -e ./packages/maverick-mcp
      - name: Run the TypeScript MCP client end-to-end
        working-directory: examples/clients/typescript
        run: |
          npm ci
          npm run check

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"
      - name: Install Lightwork (kernel + MCP server)
        run: |
          pip install -e ./packages/maverick-core
          pip install --no-deps -e ./packages/maverick-mcp
      - name: Run the Go MCP client end-to-end
        working-directory: examples/clients/go
        run: go run .
