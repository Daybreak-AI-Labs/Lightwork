name: Docs

on:
  # Also on PRs. This workflow ran only on pushes to main behind a paths
  # filter, so a --strict failure was invisible until after merge -- and the
  # site had failed every build for 30 consecutive runs without anyone seeing
  # a red check. A docs build nobody watches is not a gate.
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'TRADEMARK.md'
      - 'CLA.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install 'mkdocs-material>=9.5'
      - name: Symlink top-level community files into docs/
        # MkDocs only serves files under docs/; we symlink so we don't
        # duplicate content in two places.
        run: |
          set -e
          mkdir -p docs
          for f in CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md ROADMAP.md \
                   TRADEMARK.md CLA.md; do
            if [ -f "$f" ] && [ ! -e "docs/$f" ]; then
              ln -s "../$f" "docs/$f"
            fi
          done
          # ROADMAP.md may already live under docs/.
          if [ -f "ROADMAP.md" ] && [ ! -e "docs/ROADMAP.md" ]; then
            ln -s "../ROADMAP.md" "docs/ROADMAP.md"
          fi
      - name: Configure Pages
        if: github.event_name == 'push'
        # enablement: true turns GitHub Pages on (build type = GitHub Actions)
        # if it isn't already, so a fresh clone/fork doesn't 404 until someone
        # flips the repo setting by hand. No-op once Pages is enabled.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - name: Build site
        run: mkdocs build --strict --site-dir _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name == 'push'
        with:
          path: _site

  deploy:
    needs: build
    # Build on PRs, publish only from main: a PR must not be able to replace
    # the live site, and Pages deployment needs write permissions a fork PR
    # does not get.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
