name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

# Release installs must resolve through the same reviewed dependency set as CI.
# Exact direct build-tool pins below make intent visible; the constraint also
# closes transitive-dependency drift.
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements/ci.txt

jobs:
  validate-release-tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release-ref.outputs.tag }}
      ref: ${{ steps.release-ref.outputs.ref }}
      prerelease: ${{ steps.release-ref.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: release-ref
        name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix: $tag" >&2
            exit 1
          fi

          git fetch --force --tags origin "refs/tags/$tag:refs/tags/$tag"
          tag_sha="$(git rev-list -n 1 "refs/tags/$tag")"

          if [[ "$EVENT_NAME" == "push" && "$EVENT_SHA" != "$tag_sha" ]]; then
            echo "Pushed tag $tag resolves to $tag_sha, not workflow SHA $EVENT_SHA" >&2
            exit 1
          fi

          # A keyless certificate is bound to the workflow run's Git ref, not
          # the later checkout. A manual release therefore must be dispatched
          # with "Use workflow from" set to this exact tag; dispatching from
          # main would produce a refs/heads/main identity that the verifier
          # correctly rejects.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            expected_ref="refs/tags/$tag"
            if [[ "$EVENT_REF" != "$expected_ref" ]]; then
              echo "Manual release must run from $expected_ref, not $EVENT_REF" >&2
              exit 1
            fi
            if [[ "$EVENT_SHA" != "$tag_sha" ]]; then
              echo "Manual release SHA $EVENT_SHA does not match $tag at $tag_sha" >&2
              exit 1
            fi
          fi

          # Read every cohort/version file from the immutable release commit.
          git checkout --detach "$tag_sha"

          export RELEASE_VERSION="${tag#v}"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_VERSION"]
          cohort = tomllib.loads(Path("release-cohort.toml").read_text(encoding="utf-8"))
          if cohort["version"] != expected:
              raise SystemExit(
                  f"tag version {expected!r} != release-cohort.toml {cohort['version']!r}"
              )
          if len(cohort["packages"]) != 8:
              raise SystemExit("release cohort must contain exactly eight public packages")
          for package in cohort["packages"]:
              path = Path(package["path"]) / "pyproject.toml"
              project = tomllib.loads(path.read_text(encoding="utf-8"))["project"]
              if project["name"] != package["distribution"]:
                  raise SystemExit(
                      f"{path}: expected distribution {package['distribution']!r}, "
                      f"found {project['name']!r}"
                  )
              if project["version"] != expected:
                  raise SystemExit(
                      f"{path}: version {project['version']!r} != tag {expected!r}"
                  )
          print(f"release cohort OK: 8 packages at {expected}")
          PY

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  docker-image:
    needs: validate-release-tag
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.stage.outputs.image }}
      stage-tag: ${{ steps.stage.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: stage
        name: Define the immutable staging image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lightwork"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - id: build
        name: Build and stage the immutable container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          # Multi-architecture python:3.12-slim OCI index, resolved from the
          # Docker registry on 2026-07-29. Dependabot/release review should
          # advance this digest deliberately with the dependency constraints.
          build-args: >-
            PYTHON_DIGEST=@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
          tags: ${{ steps.stage.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate-release-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  # PyPI publishing lives in publish.yml (Trusted Publishing / OIDC).
  # The legacy token-based job that used to live here is removed: both
  # workflows triggered on the same `v*` tag and would have collided on
  # first release.

  binaries:
    needs: validate-release-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: maverick-linux-x86_64
          - os: macos-15
            artifact: maverick-macos-arm64
          - os: windows-2022
            artifact: maverick-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Lightwork + deps
        shell: bash
        run: |
          python -m pip install --upgrade 'pip==26.1.2'
          # NOT editable (-e): PyInstaller can't collect editable installs,
          # which is why the binary crashed with "No module named 'maverick'".
          # A regular install puts the packages in site-packages where the
          # analyzer (and the spec's collect_submodules) can find them. Supply
          # the complete release cohort in one resolver transaction so every
          # distribution's declared base dependencies are installed.
          python scripts/install_release_cohort.py \
            --target-python python \
            --core-extra release-runtime
          # PyInstaller and its transitive helpers are constrained in
          # requirements/ci.txt so rebuilding a tag cannot silently consume a
          # new packager or hook set.
          python -m pip install --constraint requirements/ci.txt \
            'pyinstaller==6.21.0'
          python -m pip check
          python -c "from maverick.providers import verify_release_runtime; verify_release_runtime()"
          python -c "from importlib.metadata import version; assert version('pywhispercpp') == '1.5.0'; print('pywhispercpp:', version('pywhispercpp'))"
      - name: Diagnostic - verify sqlite3 is importable at build time
        shell: bash
        run: |
          # Prove sqlite3 is available BEFORE pyinstaller runs. If this
          # fails, the Python install on the runner doesn't have sqlite3
          # support compiled in -- which is what would silently cause
          # --hidden-import sqlite3 to be a no-op (you can't bundle what
          # doesn't exist in the source Python). The v0.1.0/v0.1.1
          # release binaries failed precisely this way on all 3 OSes.
          python -c "import sqlite3; print('sqlite3 version:', sqlite3.sqlite_version)"
          python -c "import _sqlite3; print('_sqlite3 ok')"
      - name: Build single-file binary
        shell: bash
        working-directory: build
        run: |
          # Spec file gives the analyzer an unambiguous hiddenimports list.
          # Previous attempts via --hidden-import on the CLI silently no-op'd
          # under --collect-all interaction; the spec file pattern is what
          # the PyInstaller docs recommend for non-trivial builds.
          pyinstaller --clean --noconfirm --distpath ../dist maverick.spec
      - name: Smoke-test the binary covers all subcommands
        shell: bash
        run: |
          ./dist/maverick --help
          ./dist/maverick version
          ./dist/maverick dashboard --help
          ./dist/maverick mcp --help
          ./dist/maverick release-runtime-check
          voice_status="$(./dist/maverick voice status)"
          printf '%s\n' "$voice_status"
          grep -F "pywhispercpp engine (installed)" <<<"$voice_status"
      - name: Rename artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/maverick.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/maverick "dist/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  standalone-sku-artifacts:
    needs: validate-release-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build reproducible standalone SKU source archives
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          revision="$(git rev-parse HEAD)"
          python scripts/build_standalone_skus.py \
            --version "$version" \
            --source-revision "$revision" \
            --output-dir dist
          (cd dist && sha256sum --check "lightwork-standalone-skus-${version}.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standalone-sku-source
          path: |
            dist/lightwork-*.zip
            dist/lightwork-standalone-skus-*.cdx.json
            dist/lightwork-standalone-skus-*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    # PyPI publish lives in publish.yml on the same tag; this workflow
    # owns Docker images, single-file binaries, standalone source archives,
    # and the GitHub release that bundles them.
    needs: [validate-release-tag, docker-image, binaries, standalone-sku-artifacts]
    runs-on: ubuntu-24.04
    if: >-
      always() &&
      needs.docker-image.result == 'success' &&
      needs.binaries.result == 'success' &&
      needs.standalone-sku-artifacts.result == 'success'
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # promote the staged GHCR digest after all builds pass
      id-token: write   # keyless cosign signing (Sigstore OIDC, no stored keys)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Generate CycloneDX SBOM for the release
        # Per-release SBOM attached to the GitHub Release. It describes the
        # isolated environment produced by the same complete 8-package cohort
        # and release-runtime provider extra shipped in the frozen artifacts.
        # The CycloneDX generator's own dependencies are not part of that claim.
        run: |
          python -m pip install --upgrade 'pip==26.1.2'
          python -m pip install 'cyclonedx-bom==7.3.1'
          SBOM_ENV="$RUNNER_TEMP/lightwork-release-sbom"
          python -m venv "$SBOM_ENV"
          "$SBOM_ENV/bin/python" -m pip install --upgrade 'pip==26.1.2'
          python scripts/install_release_cohort.py \
            --source-root . \
            --target-python "$SBOM_ENV/bin/python" \
            --constraint requirements/ci.txt \
            --core-extra release-runtime
          "$SBOM_ENV/bin/maverick" release-runtime-check
          cyclonedx-py environment "$SBOM_ENV/bin/python" \
            --pyproject packages/maverick-core/pyproject.toml \
            -o "dist/maverick-sbom-${{ needs.validate-release-tag.outputs.tag }}.cdx.json"
          test -s "dist/maverick-sbom-${{ needs.validate-release-tag.outputs.tag }}.cdx.json"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the signed container promotion plan
        env:
          CONTAINER_DIGEST: ${{ needs.docker-image.outputs.digest }}
          CONTAINER_IMAGE: ${{ needs.docker-image.outputs.image }}
          CONTAINER_STAGE_TAG: ${{ needs.docker-image.outputs.stage-tag }}
          PRERELEASE: ${{ needs.validate-release-tag.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONTAINER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          version="${RELEASE_TAG#v}"
          target_tags=("$CONTAINER_IMAGE:$version")
          if [[ "$PRERELEASE" == "false" ]]; then
            target_tags+=("$CONTAINER_IMAGE:${version%.*}")
            target_tags+=("$CONTAINER_IMAGE:latest")
          fi
          TARGET_TAGS="$(printf '%s\n' "${target_tags[@]}")"
          export TARGET_TAGS
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "digest": os.environ["CONTAINER_DIGEST"],
              "image": os.environ["CONTAINER_IMAGE"],
              "promotion_required_before_publish": True,
              "source_revision": os.environ["GITHUB_SHA"],
              "staging_tag": os.environ["CONTAINER_STAGE_TAG"],
              "target_tags": os.environ["TARGET_TAGS"].splitlines(),
              "version": os.environ["RELEASE_TAG"].removeprefix("v"),
          }
          target = Path("dist") / f"maverick-container-{os.environ['RELEASE_TAG']}.json"
          target.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"wrote {target}")
          PY
      - name: Generate a complete release checksum manifest
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for expected in \
            dist/maverick-linux-x86_64 \
            dist/maverick-macos-arm64 \
            dist/maverick-windows-x86_64.exe; do
            test -s "$expected"
          done
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path("dist")
          target = root / f"maverick-release-{os.environ['RELEASE_TAG']}.sha256"
          files = sorted(
              path
              for path in root.rglob("*")
              if path.is_file()
              and path != target
              and path.suffix not in {".pem", ".sig"}
          )
          if len(files) < 8:
              raise SystemExit(f"incomplete release artifact set: only {len(files)} files")
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  "
              f"{path.relative_to(root).as_posix()}"
              for path in files
          ]
          target.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"checksummed {len(files)} release artifacts into {target}")
          PY
          (cd dist && sha256sum --check "maverick-release-${RELEASE_TAG}.sha256")
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the immutable container digest (keyless, Sigstore)
        env:
          CONTAINER_DIGEST: ${{ needs.docker-image.outputs.digest }}
          CONTAINER_IMAGE: ${{ needs.docker-image.outputs.image }}
          COSIGN_YES: "true"
        run: cosign sign --yes "$CONTAINER_IMAGE@$CONTAINER_DIGEST"
      - name: Sign release artifacts (keyless, Sigstore)
        # Keyless signing: cosign mints a short-lived cert bound to THIS
        # workflow's OIDC identity and logs the signature to the public Rekor
        # transparency log -- no long-lived private key to store or leak. For
        # each binary, standalone source archive, checksum manifest, and SBOM
        # gets a detached `.sig` (signature) and `.pem` (signing certificate);
        # users verify with
        # `cosign verify-blob` (see deploy/verify-release.sh).
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/maverick-* dist/lightwork-*)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts found to sign" >&2
            exit 1
          fi
          for f in "${artifacts[@]}"; do
            echo "signing $f"
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
            test -s "$f.sig"
            test -s "$f.pem"
          done
      - name: Create the signed release as a draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # The validation job resolves manual dispatches and tag pushes
          # to the same v* tag that every build job checked out.
          tag_name: ${{ needs.validate-release-tag.outputs.tag }}
          # Binaries, versioned standalone source archives, SHA-256 manifest,
          # CycloneDX SBOMs, and their Sigstore signatures/certificates.
          files: |
            dist/maverick-*
            dist/lightwork-*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.validate-release-tag.outputs.prerelease }}
          make_latest: false
      - name: Promote and verify the signed container digest
        env:
          CONTAINER_DIGEST: ${{ needs.docker-image.outputs.digest }}
          CONTAINER_IMAGE: ${{ needs.docker-image.outputs.image }}
          PRERELEASE: ${{ needs.validate-release-tag.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONTAINER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          version="${RELEASE_TAG#v}"
          target_tags=("$CONTAINER_IMAGE:$version")
          if [[ "$PRERELEASE" == "false" ]]; then
            target_tags+=("$CONTAINER_IMAGE:${version%.*}")
            target_tags+=("$CONTAINER_IMAGE:latest")
          fi
          tag_args=()
          for tag in "${target_tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$CONTAINER_IMAGE@$CONTAINER_DIGEST"
          for tag in "${target_tags[@]}"; do
            actual="$(
              docker buildx imagetools inspect "$tag" |
                awk '$1 == "Digest:" {print $2; exit}'
            )"
            if [[ "$actual" != "$CONTAINER_DIGEST" ]]; then
              echo "$tag resolves to $actual, not $CONTAINER_DIGEST" >&2
              exit 1
            fi
          done
      - name: Publish the verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate-release-tag.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          args=(release edit "$RELEASE_TAG" --draft=false)
          if [[ "$PRERELEASE" == "false" ]]; then
            args+=(--latest)
          fi
          gh "${args[@]}"
