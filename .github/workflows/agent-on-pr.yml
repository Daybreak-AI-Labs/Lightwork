name: Lightwork agent on PR (reusable)

# Reusable workflow for downstream projects: invoke a Lightwork goal on
# every pull request. Comment the agent's findings as a PR review.
#
# Usage in a consumer repo's `.github/workflows/code-review.yml`:
#
#     jobs:
#       review:
#         uses: Daybreak-AI-Labs/Lightwork/.github/workflows/agent-on-pr.yml@<full-40-character-commit-sha>
#         with:
#           goal: "Review this PR for logic bugs and missing edge cases."
#           # Must match the immutable SHA in `uses:` above.
#           lightwork_ref: "<full-40-character-commit-sha>"
#           max_dollars: 0.50
#           # Optional: run as your customized workforce by committing a bundle
#           # (domains/*.toml + roles.toml, e.g. via `maverick overrides export`)
#           # and pointing at it:
#           overrides_path: ".maverick"
#         secrets:
#           ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#           # Needed when the caller's GITHUB_TOKEN cannot read the private
#           # Lightwork repository. Use a read-only GitHub App/PAT token.
#           LIGHTWORK_SOURCE_TOKEN: ${{ secrets.LIGHTWORK_SOURCE_TOKEN }}

on:
  workflow_call:
    inputs:
      goal:
        description: 'Goal text for the agent.'
        required: true
        type: string
      lightwork_ref:
        description: >-
          Full 40-character commit SHA of the trusted Lightwork source to
          install. Use the same SHA that pins this reusable workflow.
        required: true
        type: string
      max_dollars:
        description: 'Hard cost cap for the agent run.'
        required: false
        default: 1.00
        type: number
      model:
        description: 'Model spec (e.g. anthropic:claude-sonnet-4-6).'
        required: false
        default: 'anthropic:claude-sonnet-4-6'
        type: string
      timeout_minutes:
        description: 'Job timeout.'
        required: false
        default: 15
        type: number
      overrides_path:
        description: >-
          Optional path (relative to the calling repo) to a Lightwork override
          bundle: a directory with domains/*.toml and/or roles.toml, applied
          before the run so the review uses this client's customized agents.
        required: false
        default: ''
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      LIGHTWORK_SOURCE_TOKEN:
        description: >-
          Optional read-only token for checking out the private Lightwork
          repository. The caller GITHUB_TOKEN is used when this is omitted.
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  agent-review:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate immutable Lightwork source ref
        shell: bash
        env:
          LIGHTWORK_REF: ${{ inputs.lightwork_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$LIGHTWORK_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::lightwork_ref must be a lowercase, full 40-character commit SHA."
            exit 1
          fi

      - name: Checkout pinned Lightwork runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Daybreak-AI-Labs/Lightwork
          ref: ${{ inputs.lightwork_ref }}
          path: .lightwork-runtime
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.LIGHTWORK_SOURCE_TOKEN || github.token }}

      - name: Install Lightwork
        shell: bash
        env:
          LIGHTWORK_REF: ${{ inputs.lightwork_ref }}
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/.lightwork-runtime"
          actual_ref="$(git -C "$source_root" rev-parse HEAD)"
          if [ "$actual_ref" != "$LIGHTWORK_REF" ]; then
            echo "::error::Checked-out Lightwork commit '$actual_ref' does not match the requested ref."
            exit 1
          fi

          # Supply all first-party distributions as local direct requirements
          # in one resolver transaction. Never resolve an unclaimed
          # maverick-* project name from the public package index.
          python -m pip install --constraint "$source_root/requirements/ci.txt" \
            "$source_root/packages/maverick-core[all]" \
            "$source_root/packages/maverick-shield" \
            "$source_root/packages/maverick-channels" \
            "$source_root/packages/maverick-evolve" \
            "$source_root/packages/maverick-dashboard" \
            "$source_root/packages/maverick-mcp" \
            "$source_root/packages/maverick-knowledge" \
            "$source_root/apps/installer-cli"
          python -m pip check

          # Keep the reviewed calling-repository checkout as the agent's only
          # source tree. Installed wheels do not need this temporary checkout.
          rm -rf -- "$source_root"

      - name: Run agent
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAVERICK_CONSENT_MODE: auto-deny
          MAVERICK_FETCH_RESPECT_ROBOTS: '1'
          # Caller inputs reach the script ONLY via env. Expression-
          # interpolating them into `run:` would let a goal/model string
          # containing `$(...)`, quotes, or newlines inject shell or TOML.
          AGENT_GOAL: ${{ inputs.goal }}
          AGENT_MODEL: ${{ inputs.model }}
          AGENT_MAX_DOLLARS: ${{ inputs.max_dollars }}
          AGENT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          AGENT_WORKDIR: ${{ github.workspace }}
          AGENT_OVERRIDES_PATH: ${{ inputs.overrides_path }}
        run: |
          set -e
          mkdir -p ~/.maverick
          # Build the config in Python: json.dumps emits valid TOML basic
          # strings, and the numeric inputs are validated as numbers.
          python - <<'PY'
          import json, os, pathlib

          model = json.dumps(os.environ["AGENT_MODEL"])
          workdir = json.dumps(os.environ["AGENT_WORKDIR"])
          max_dollars = float(os.environ["AGENT_MAX_DOLLARS"])
          max_wall_seconds = int(float(os.environ["AGENT_TIMEOUT_MINUTES"]) * 60)

          # The provider API key is NOT written into this config: Lightwork reads
          # it straight from the environment (ANTHROPIC_API_KEY / OPENAI_API_KEY,
          # exported above from secrets) via maverick.llm. That avoids both a
          # GitHub Actions expression in the run block (a bare name fails to
          # compile) and ever writing the secret into the run-script text.
          config = f"""\
          [models]
          orchestrator = {model}
          coder        = {model}
          researcher   = {model}

          [budget]
          max_dollars = {max_dollars}
          max_wall_seconds = {max_wall_seconds}
          max_tool_calls = 200

          [safety]
          profile = "balanced"
          block_threshold = "high"
          scan_input = true
          scan_tool_calls = true
          scan_output = true

          [sandbox]
          backend = "local"
          workdir = {workdir}
          timeout = 60
          """
          path = pathlib.Path.home() / ".maverick" / "config.toml"
          path.write_text(config, encoding="utf-8")
          PY

          # Apply this client's customization bundle, if the caller shipped one
          # in their repo (domains/*.toml + roles.toml). The path arrives via env
          # (never interpolated into the script) and is relative to the checked-
          # out repo; a missing or invalid bundle is reported, never fatal.
          if [ -n "${AGENT_OVERRIDES_PATH:-}" ]; then
            maverick overrides load "${AGENT_WORKDIR}/${AGENT_OVERRIDES_PATH}" \
              || echo "::warning::maverick overrides load failed; continuing with defaults"
          fi

          # Run; capture output for the PR comment.
          python - <<'PY' 2>&1 | tee /tmp/agent-output.txt
          import os, subprocess
          p = subprocess.run(["maverick", "start", os.environ["AGENT_GOAL"]], check=False)
          raise SystemExit(p.returncode)
          PY
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        # always() so the comment still posts when the agent step exits non-zero
        # (GHA's default bash -eo pipefail fails the step) -- a failed run is
        # exactly when the reviewer most needs to see the captured output.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            let body = "🤖 **Lightwork agent review**\n\n";
            try {
              const out = fs.readFileSync("/tmp/agent-output.txt", "utf8");
              let redacted = out
                .replace(/sk-ant-[A-Za-z0-9_\-]+/g, "[REDACTED_ANTHROPIC_KEY]")
                .replace(/sk-proj[A-Za-z0-9_\-]+/g, "[REDACTED_OPENAI_KEY]")
                .replace(/gh[pousr]_[A-Za-z0-9_]+/g, "[REDACTED_GITHUB_TOKEN]");

              // Truncate to avoid GitHub's 65k comment limit.
              const max = 50000;
              body += "```\n" + (redacted.length > max
                ? redacted.slice(0, max) + "\n\n[... truncated]"
                : redacted
              ) + "\n```";
            } catch (e) {
              body += `(no output captured: ${e.message})`;
            }
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
