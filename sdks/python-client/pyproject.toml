# Checkout-only helper. Not published, not a uv workspace member, not in the
# release cohort. Install from a checkout with: pip install ./sdks/python-client
[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lightwork-client"
version = "0.1.0"
description = "Standard-library Python client for the Lightwork /api/v1 REST API (not published)"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{ name = "cdayAI" }]
# Standard library only: no runtime dependencies.
dependencies = []

[tool.setuptools]
packages = ["lightwork_client"]
